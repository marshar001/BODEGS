<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset password — BODEGS</title>
  <style>
    :root { --brand: #173b32; --bg: #f5f0e7; --card: #faf7f1; --muted: #6f7f78; --line: rgba(23,59,50,.22); --red: #b3261e; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body { min-height: 100vh; background: var(--bg); color: var(--brand); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
    .wrap { max-width: 440px; margin: 0 auto; padding: 28px 18px 36px; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 26px; }
    .brand i { width: 46px; height: 46px; border-radius: 15px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-weight: 700; font-size: 23px; font-style: normal; box-shadow: 0 8px 18px rgba(0,0,0,.18); }
    .brand b { display: block; font-family: Georgia, serif; font-size: 22px; letter-spacing: .1em; line-height: 1; }
    h1 { margin: 0 0 8px; text-align: center; font-family: Georgia, "Times New Roman", serif; font-size: 32px; line-height: 1.12; }
    .sub { margin: 0 auto 24px; max-width: 320px; text-align: center; color: var(--muted); font-size: 15.5px; line-height: 1.45; }
    .card { background: var(--card); border-radius: 26px; padding: 22px 20px; box-shadow: 0 14px 40px rgba(0,0,0,.09); }
    .msg { margin: 0 0 14px; padding: 11px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; background: var(--bg); }
    .msg.err { background: #fdecea; color: var(--red); }
    .msg.ok { background: #e6f4ea; color: #1f6f43; }
    .lab { margin: 0 0 8px; font-size: 15px; font-weight: 700; }
    .field { position: relative; margin-bottom: 18px; }
    .field input { display: block; width: 100%; height: 54px; padding: 0 52px 0 16px; border: 1.5px solid var(--line); border-radius: 16px; background: transparent; font-family: inherit; font-size: 16px; color: var(--brand); outline: none; }
    .field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(0,0,0,.05); }
    .field .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border: 0; background: none; cursor: pointer; padding: 0; color: var(--brand); font-size: 12px; font-weight: 700; font-family: inherit; }
    .go { width: 100%; height: 56px; border: 0; border-radius: 18px; background: var(--brand); color: #fff; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer; box-shadow: 0 10px 22px rgba(0,0,0,.20); display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .go:disabled { opacity: .6; }
    .note { text-align: center; color: var(--muted); font-size: 15px; line-height: 1.5; padding: 10px 4px 18px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i>B</i><div><b>BODEGS</b></div></div>
  <h1>Set a new password</h1>
  <p class="sub" id="sub">Choose a new password for your account.</p>
  <div class="card">
    <p class="note" id="checking">Checking your reset link...</p>

    <div id="bad" hidden>
      <p class="note">This reset link is invalid or has expired. Please request a new one.</p>
      <a class="go" href="login.html">Back to login</a>
    </div>

    <form id="form" novalidate hidden>
      <div class="msg err" id="err" hidden></div>
      <div class="lab">New password <span style="font-weight:400;color:var(--muted)">(8+ characters)</span></div>
      <div class="field"><input id="p1" type="password" autocomplete="new-password" placeholder="New password"><button type="button" class="eye" data-for="p1">Show</button></div>
      <div class="lab">Confirm new password</div>
      <div class="field"><input id="p2" type="password" autocomplete="new-password" placeholder="Type it again"><button type="button" class="eye" data-for="p2">Show</button></div>
      <button class="go" id="go" type="submit">Save new password</button>
    </form>

    <div id="done" hidden>
      <div class="msg ok">Password changed. Taking you to BODEGS...</div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  // Same public project settings as supabase.js (public anon key, safe here).
  // This page does not load supabase.js on purpose, so no shop theme is applied to it.
  const sb = window.supabase.createClient(
    "https://cdwstvsesiyvfcadyqzs.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkd3N0dnNlc2l5dmZjYWR5cXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzE3MDUsImV4cCI6MjEwODcwNzcwNX0.x4GYf-0YvR1gVUfXFKR3JntWO8lTaMGf_AT2Za9Kf8Y"
  );
  const $ = (id) => document.getElementById(id);
  const link = location.hash + "&" + location.search;
  const looksLikeError = /error=|error_code=|error_description=/.test(link);
  let state = "wait";

  function showForm() { if (state !== "wait") return; state = "form"; $("checking").hidden = true; $("form").hidden = false; $("p1").focus(); }
  function showBad() { if (state !== "wait") return; state = "bad"; $("checking").hidden = true; $("bad").hidden = false; $("sub").hidden = true; }

  sb.auth.onAuthStateChange((event) => { if (event === "PASSWORD_RECOVERY") showForm(); });
  if (looksLikeError) { showBad(); }
  else { setTimeout(showBad, 4000); }

  document.querySelectorAll(".eye").forEach((b) => b.addEventListener("click", () => {
    const i = $(b.dataset.for);
    i.type = i.type === "password" ? "text" : "password";
    b.textContent = i.type === "password" ? "Show" : "Hide";
  }));

  function say(t) { const e = $("err"); e.textContent = t || ""; e.hidden = !t; }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault(); say("");
    const a = $("p1").value, b = $("p2").value;
    if (a.length < 8) { say("Your password needs at least 8 characters."); return; }
    if (a !== b) { say("The two passwords do not match."); return; }
    $("go").disabled = true;
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) {
      const m = (error.message || "").toLowerCase();
      say(m.indexOf("different") >= 0 ? "Please choose a password you have not used before."
        : m.indexOf("session") >= 0 ? "This reset link has expired. Please request a new one from the login page."
        : (error.message || "Could not save the password. Please try again."));
      $("go").disabled = false;
      return;
    }
    $("form").hidden = true; $("done").hidden = false;
    setTimeout(() => { location.replace("index.html"); }, 1500);
  });
})();
</script>
</body>
</html>
