<!DOCTYPE html>
<html lang="en">
<head>
  <script src="cartkey.js?v=1"></script>
  <script src="dark.js?v=3"></script>
  <script src="press.js?v=1" defer></script>
  <script>
  // BODEGS login guard: uses the real Supabase session instead of the old fake login.
  (function () {
    var REF = "cdwstvsesiyvfcadyqzs"; // your Supabase project id
    var session = null;
    try { session = JSON.parse(localStorage.getItem("sb-" + REF + "-auth-token") || "null"); } catch (e) {}
    var u = session && session.user;

    if (!u || !u.email) {
      // Not signed in: remove any leftover old fake login, then go to the real login page.
      try { localStorage.removeItem("weraeUser"); } catch (e) {}
      location.replace("login.html?next=profile.html");
      return;
    }

    // Signed in: give the rest of this page the details it expects (never a password).
    var old = null;
    try { old = JSON.parse(localStorage.getItem("weraeUser") || "null"); } catch (e) {}
    var meta = u.user_metadata || {};
    var user = (old && old.email === u.email) ? old : {
      email: u.email,
      name: meta.full_name || u.email.split("@")[0]
    };
    delete user.password;
    user.loggedIn = true;
    localStorage.setItem("weraeUser", JSON.stringify(user));
  })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Profile — BODEGS</title>
  <meta
    name="description"
    content="Manage your BODEGS account, orders and delivery addresses."
  >

  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: var(--cream);
    }

    .profile-page {
      max-width: 720px;
      margin: 0 auto;
      min-height: 100vh;
      padding-top: 16px;
      padding-bottom: 110px;
    }

    /* Header band */
    .profile-header {
      padding: 22px 20px 54px;
      background: var(--deep-green);
      border-radius: 0 0 28px 28px;
      color: var(--cream);
    }

    .profile-header h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .profile-body {
      margin: 0 16px;
    }

    /* Profile card */
    .profile-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--cream-light);
      border: 1px solid rgba(23, 59, 50, 0.06);
      border-radius: 24px;
      box-shadow: 0 8px 22px rgba(23, 59, 50, 0.1);
    }

    .avatar-wrap {
      position: relative;
      flex: 0 0 76px;
      width: 76px;
      height: 76px;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--deep-green);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-edit {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 2px solid var(--cream-light);
      border-radius: 50%;
      background: var(--sage);
      color: var(--deep-green);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-edit svg {
      width: 13px;
      height: 13px;
    }

    .profile-info {
      min-width: 0;
      flex: 1;
    }

    .profile-info h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      line-height: 1.15;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-info .email {
      margin-top: 3px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-pill {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 12px;
      background: var(--deep-green);
      color: var(--cream);
      font-family: Arial, sans-serif;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 0.4px;
    }
        /* Quick buttons */
    .quick-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0;
    }

    .quick-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(23, 59, 50, 0.06);
      border-radius: 20px;
      background: var(--cream-light);
      box-shadow: 0 5px 14px rgba(23, 59, 50, 0.06);
      color: var(--text);
      text-align: left;
      text-decoration: none;
      font-family: Arial, sans-serif;
    }

    .quick-icon {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(23, 59, 50, 0.09);
      color: var(--deep-green);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quick-btn strong {
      display: block;
      font-size: 13px;
    }

    .quick-btn small {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
    }

    /* Menu list */
    .menu-card {
      padding: 4px 16px;
      background: var(--cream-light);
      border: 1px solid rgba(23, 59, 50, 0.06);
      border-radius: 24px;
      box-shadow: 0 5px 14px rgba(23, 59, 50, 0.06);
    }

    .menu-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border: none;
      border-bottom: 1px solid rgba(23, 59, 50, 0.08);
      background: transparent;
      color: var(--text);
      text-align: left;
      font-family: Arial, sans-serif;
    }

    .menu-row:last-child {
      border-bottom: none;
    }

    .menu-row:active {
      transform: none;
      opacity: 0.7;
    }

    .menu-icon {
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
      color: var(--deep-green);
    }

    .menu-text {
      flex: 1;
      min-width: 0;
    }

    .menu-text strong {
      display: block;
      font-size: 14px;
      font-weight: 600;
    }

    .menu-text small {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      line-height: 1.3;
      color: var(--muted);
    }

    .menu-chevron {
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      color: var(--muted);
    }

    .menu-icon,
    .menu-chevron,
    .quick-icon svg,
    .avatar-edit svg,
    .support-btn svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .quick-icon svg {
      width: 20px;
      height: 20px;
    }

    .menu-row.danger .menu-icon,
    .menu-row.danger strong {
      color: #a3392f;
    }
        /* Support card */
    .support-card {
      margin-top: 14px;
      padding: 20px 16px;
      background: var(--cream-light);
      border: 1px solid rgba(23, 59, 50, 0.06);
      border-radius: 24px;
      box-shadow: 0 5px 14px rgba(23, 59, 50, 0.06);
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .support-card h3 {
      font-size: 15px;
      color: var(--text);
    }

    .support-card p {
      margin: 5px 0 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .support-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: 1px solid var(--sage);
      border-radius: 14px;
      background: #fff;
      color: var(--deep-green);
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
    }

    .support-btn svg {
      width: 18px;
      height: 18px;
    }

    .social-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .social-row a {
      padding: 8px 14px;
      border-radius: 14px;
      background: rgba(23, 59, 50, 0.08);
      color: var(--deep-green);
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
    }

    /* settings icon on the profile card */
    .profile-card { position: relative; }
    .profile-info { padding-right: 38px; }
    .gear {
      position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; padding: 0;
      border: 0; border-radius: 50%; background: rgba(23, 59, 50, 0.08); color: var(--deep-green);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .gear svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .gear:active { transform: scale(.94); }

    /* appearance card */
    .ap-card { margin: 14px 0 0; padding: 14px 16px 16px; background: var(--cream-light); border: 1px solid rgba(23,59,50,.06); border-radius: 22px; font-family: Arial, sans-serif; }
    .ap-card strong { display: block; font-size: 15px; color: var(--text); }
    .ap-card small { display: block; margin: 2px 0 12px; font-size: 12.5px; color: var(--muted); }

    /* settings page */
    body.st-open { overflow: hidden; }
    body.st-open nav.bottom-nav { display: none !important; }
    .settings-page { position: fixed; inset: 0; z-index: 1500; overflow-y: auto; background: var(--cream); font-family: Arial, sans-serif; color: var(--text); }
    .settings-page[hidden] { display: none; }
    .st-top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 14px; background: var(--cream); }
    .st-top h1 { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; color: var(--text); }
    .st-back { width: 38px; height: 38px; padding: 0; border: 0; background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center; }
    .st-back svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .st-wrap { max-width: 720px; margin: 0 auto; padding: 4px 16px 40px; }
    .st-group { margin-top: 14px; background: var(--cream-light); border: 1px solid rgba(23,59,50,.06); border-radius: 22px; overflow: hidden; }
    .st-row { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 54px; padding: 0 18px; border: 0; border-bottom: 1px solid rgba(23,59,50,.08); background: transparent; color: var(--text); font: 15px Arial, sans-serif; text-align: left; cursor: pointer; }
    .st-row:last-child { border-bottom: 0; }
    .st-row:active { background: rgba(23,59,50,.05); }
    .st-row svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .st-row.danger { color: #a3392f; }
    .st-ap { padding: 14px 18px 16px; }
    .st-ap strong { display: block; font-size: 15px; margin-bottom: 10px; font-weight: 400; }

    /* confirmation pop-up */
    .cf-back { position: fixed; inset: 0; z-index: 3000; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(18,30,26,.55); }
    .cf-back[hidden] { display: none; }
    .cf-box { width: 100%; max-width: 340px; padding: 22px 20px 16px; border-radius: 24px; background: var(--cream-light); font-family: Arial, sans-serif; text-align: center; animation: sheetUp .2s ease-out; }
    .cf-box h3 { font-family: Arial, sans-serif; font-size: 18px; color: var(--text); }
    .cf-box p { margin: 8px 0 18px; font-size: 14px; line-height: 1.5; color: var(--muted); }
    .cf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cf-btns button { height: 46px; border: 0; border-radius: 14px; font: 700 15px Arial, sans-serif; cursor: pointer; }
    .cf-no { background: rgba(23,59,50,.08); color: var(--text); }
    .cf-yes { background: var(--deep-green); color: #fff; }
    .cf-yes.danger { background: #a3392f; }

    /* feedback */
    .fb-stars { display: flex; gap: 8px; margin: 6px 0 14px; }
    .fb-stars button { border: 0; background: transparent; font-size: 32px; line-height: 1; color: rgba(23,59,50,.25); padding: 0; cursor: pointer; }
    .fb-stars button.on { color: #e0a526; }
    .fb-text { box-sizing: border-box; width: 100%; min-height: 96px; padding: 12px; border: 1px solid rgba(23,59,50,.14); border-radius: 14px; background: var(--cream); color: var(--text); font: 14px Arial, sans-serif; resize: vertical; }
    .fb-send { width: 100%; height: 48px; margin-top: 12px; border: 0; border-radius: 14px; background: var(--deep-green); color: #fff; font: 700 15px Arial, sans-serif; }
    .doc h4 { margin: 16px 0 4px; font: 700 14px Arial, sans-serif; }
    .doc p { margin: 0 0 6px; }
    .doc .btn2 { width: 100%; height: 46px; margin-top: 14px; border: 0; border-radius: 14px; background: rgba(23,59,50,.08); color: var(--text); font: 700 14px Arial, sans-serif; }
    /* Bottom sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(18, 30, 26, 0.45);
    }

    .sheet-backdrop[hidden] {
      display: none;
    }

    .sheet {
      width: 100%;
      max-width: 720px;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      background: var(--cream-light);
      border-radius: 28px 28px 0 0;
      font-family: Arial, sans-serif;
      animation: sheetUp 0.22s ease-out;
    }

    @keyframes sheetUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 10px;
    }

    .sheet-head h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      font-weight: 400;
      color: var(--text);
    }

    .sheet-close {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: rgba(23, 59, 50, 0.08);
      color: var(--deep-green);
      font-size: 20px;
      line-height: 1;
    }

    .sheet-body {
      overflow-y: auto;
      padding: 6px 20px 28px;
      font-size: 14px;
      color: var(--text);
      line-height: 1.55;
    }

    .field {
      display: block;
      margin-bottom: 14px;
    }

    .field span {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
      color: var(--deep-green);
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--sage);
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    .field input[readonly] {
      background: rgba(23, 59, 50, 0.05);
      color: var(--muted);
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      background: var(--deep-green);
      color: var(--cream);
      font-size: 14px;
      font-weight: bold;
    }

    .list-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(23, 59, 50, 0.08);
    }

    .list-item .grow {
      flex: 1;
      min-width: 0;
    }

    .list-item strong {
      display: block;
      font-size: 14px;
    }

    .list-item small {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .link-btn {
      padding: 6px 10px;
      border: none;
      border-radius: 10px;
      background: rgba(163, 57, 47, 0.1);
      color: #a3392f;
      font-size: 12px;
      font-weight: bold;
    }

    .tick {
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      background: rgba(23, 59, 50, 0.1);
      color: var(--muted);
    }

    .tick.done {
      background: var(--deep-green);
      color: var(--cream);
    }

    .sheet-subtitle {
      margin: 18px 0 10px;
      font-size: 13px;
      font-weight: bold;
      color: var(--deep-green);
    }

    .empty-note {
      padding: 6px 0 12px;
      color: var(--muted);
      font-size: 13px;
    }

    details {
      border-bottom: 1px solid rgba(23, 59, 50, 0.08);
      padding: 12px 0;
    }

    details summary {
      font-weight: 600;
      cursor: pointer;
    }

    details p {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    ol.steps {
      padding-left: 20px;
    }

    ol.steps li {
      margin-bottom: 10px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 100px;
      z-index: 3000;
      transform: translateX(-50%);
      padding: 11px 18px;
      border-radius: 16px;
      background: var(--deep-green);
      color: var(--cream);
      font-family: Arial, sans-serif;
      font-size: 13px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .toast[hidden] {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .sheet {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <main class="profile-page">

    <div class="profile-body">

      <!-- PROFILE CARD -->
      <section class="profile-card">
        <div class="avatar-wrap">
          <div class="avatar" id="avatar"></div>
          <button class="avatar-edit" id="avatarEdit" type="button" aria-label="Change profile photo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 20h4L19 9l-4-4L4 16v4Z"></path>
              <path d="m13.5 6.5 4 4"></path>
            </svg>
          </button>
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </div>

        <button class="gear" id="gearBtn" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.7-1.3-1.8-3.1-2 .8a7.6 7.6 0 0 0-2.6-1.5L14.4 3h-3.6l-.3 2.4a7.6 7.6 0 0 0-2.6 1.5l-2-.8-1.8 3.1 1.7 1.3a7.6 7.6 0 0 0 0 3l-1.7 1.3 1.8 3.1 2-.8a7.6 7.6 0 0 0 2.6 1.5l.3 2.4h3.6l.3-2.4a7.6 7.6 0 0 0 2.6-1.5l2 .8 1.8-3.1-1.7-1.3Z"/></svg>
        </button>

        <div class="profile-info">
          <h2 id="profileName"></h2>
          <p class="email" id="profileEmail"></p>
          <span class="profile-pill" id="profilePill"></span>
        </div>
      </section>

      <!-- QUICK BUTTONS -->
      <div class="quick-row">
        <a href="orders.html" class="quick-btn">
          <span class="quick-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3.5h12A1.5 1.5 0 0 1 19.5 5v14A1.5 1.5 0 0 1 18 20.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"></path>
              <path d="M8 8h8M8 12h8M8 16h5"></path>
            </svg>
          </span>
          <span>
            <strong>My Orders</strong>
            <small id="ordersCount"></small>
          </span>
        </a>

        <a href="cart.html" class="quick-btn">
          <span class="quick-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 8h14l-1 12H6L5 8Z"></path>
              <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
            </svg>
          </span>
          <span>
            <strong>My Cart</strong>
            <small id="cartCount"></small>
          </span>
        </a>
      </div>

      <!-- MENU -->
      <section class="menu-card" id="menu" aria-label="Account menu"></section>

      <!-- SUPPORT -->
      <section class="support-card" id="support" hidden>
        <h3>Contact BODEGS Support</h3>
        <p>Choose your preferred support channel below.</p>
        <div id="supportButtons"></div>
        <div class="social-row" id="socialRow"></div>
      </section>

    </div>
  </main>

  <!-- BOTTOM SHEET -->
  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <!-- SETTINGS PAGE -->
  <div class="settings-page" id="settingsPage" hidden>
    <div class="st-top">
      <button class="st-back" id="stBack" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <h1>Settings</h1>
    </div>
    <div class="st-wrap" id="stWrap"></div>
  </div>

  <!-- CONFIRM POP-UP -->
  <div class="cf-back" id="cfBack" hidden>
    <div class="cf-box" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle">
      <h3 id="cfTitle"></h3>

    <script>
    (function () {

      /* ==============================================
         SUPPORT DETAILS — fill these in with your real
         contact details. Anything left empty is hidden.
         phone / whatsapp: digits with country code,
         e.g. "2348012345678"
         instagram / facebook: full page links
         ============================================== */
      const SUPPORT = {
        phone: "",
        whatsapp: "2348107771903",
        email: "bodegs.ng@gmail.com",
        instagram: "",
        facebook: "",
        tiktok: "https://www.tiktok.com/@bodegs8"
      };

      const KEY_USER = "weraeUser";
      /* Photo and addresses are kept per account, so two accounts on one phone no longer share them. */
      const WHO = String(((function () { try { return JSON.parse(localStorage.getItem("weraeUser") || "null"); } catch (e) { return null; } })() || {}).email || "guest").toLowerCase();
      const KEY_ADDRESSES = "weraeAddresses:" + WHO;
      const KEY_AVATAR = "weraeAvatar:" + WHO;

      function read(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch (error) {
          return fallback;
        }
      }

      function write(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (error) {
          return false;
        }
      }

      function remove(key) {
        try {
          localStorage.removeItem(key);
        } catch (error) {
          // ignore
        }
      }

      /* Must be signed in, like checkout. */
      let user = read(KEY_USER, null);

      if (!user || user.loggedIn !== true) {
        window.location.replace("login.html?next=profile.html");
        return;
      }

      /* one-time: the old shared copies go to the first account that opens Profile, then are removed */
      try {
        ["Addresses", "Avatar"].forEach(function (name) {
          const oldValue = localStorage.getItem("wera" + "e" + name);
          const newKey = "wera" + "e" + name + ":" + WHO;
          if (oldValue !== null) {
            if (localStorage.getItem(newKey) === null) localStorage.setItem(newKey, oldValue);
            localStorage.removeItem("wera" + "e" + name);
          }
        });
      } catch (error) {}

      /* ---------- small helpers ---------- */

      const ICONS = {
        user: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',

        shield: '<path d="M12 3 5 6v5.5c0 4.3 2.9 7.8 7 9.5 4.1-1.7 7-5.2 7-9.5V6l-7-3Z"/><path d="m9 12 2.2 2.2L15.5 10"/>',
        orders: '<path d="M6 3.5h12A1.5 1.5 0 0 1 19.5 5v14A1.5 1.5 0 0 1 18 20.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
        help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7"/><path d="M12 17h.01"/>',
        play: '<circle cx="12" cy="12" r="9"/><path d="m10.5 8.5 5 3.5-5 3.5v-7Z"/>',
        out: '<path d="M10 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H10"/><path d="m15 8 4 4-4 4M19 12H9"/>',
        trash: '<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',

        chat: '<path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/>',
        mail: '<rect x="4" y="6" width="16" height="12" rx="2"/><path d="m5 8 7 5 7-5"/>',

      };

      function svg(name, className) {
        return (
          '<svg class="' + className + '" viewBox="0 0 24 24" aria-hidden="true">' +
          ICONS[name] +
          "</svg>"
        );
      }

      function el(tag, props, children) {
        const node = document.createElement(tag);

        Object.keys(props || {}).forEach(function (key) {
          if (key === "text") node.textContent = props[key];
          else if (key === "class") node.className = props[key];
          else node.setAttribute(key, props[key]);
        });

        (children || []).forEach(function (child) {
          node.appendChild(child);
        });

        return node;
      }

      const toastBox = document.getElementById("toast");
      let toastTimer = null;

      function toast(message) {
        toastBox.textContent = message;
        toastBox.hidden = false;
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toastBox.hidden = true;
        }, 2200);
      }

      /* ---------- bottom sheet ---------- */

      const sheet = document.getElementById("sheet");
      const sheetTitle = document.getElementById("sheetTitle");
      const sheetBody = document.getElementById("sheetBody");

      function openSheet(title, build) {
        sheetTitle.textContent = title;
        sheetBody.innerHTML = "";
        build(sheetBody);
        sheet.hidden = false;
        document.body.style.overflow = "hidden";
      }

      function closeSheet() {
        sheet.hidden = true;
        document.body.style.overflow = "";
      }

      document.getElementById("sheetClose").addEventListener("click", closeSheet);

      sheet.addEventListener("click", function (event) {
        if (event.target === sheet) closeSheet();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !sheet.hidden) closeSheet();
      });

      /* ---------- profile card ---------- */

      function initials(name) {
        const parts = String(name || "")
          .trim()
          .split(/\s+/)
          .filter(Boolean);

        if (!parts.length) return "B";
        if (parts.length === 1) return parts[0].charAt(0).toUpperCase();

        return (
          parts[0].charAt(0) + parts[parts.length - 1].charAt(0)
        ).toUpperCase();
      }

      /* The signed-in details are already stored on this phone, so the saved photo can show at once. */
      const KEY_AVATAR_URL = "weraeAvatarUrl:" + WHO;
      let remoteAvatar = null;
      let preferLocal = false;
      try {
        const stored = JSON.parse(localStorage.getItem("sb-cdwstvsesiyvfcadyqzs-auth-token") || "null");
        const m = stored && stored.user && stored.user.user_metadata;
        const uid = stored && stored.user && stored.user.id;
        /* Google sign-in rewrites "avatar_url" every time, so the photo is kept under its own name, and the file's fixed address is the backup. */
        remoteAvatar = (m && m.bodegs_photo) || read(KEY_AVATAR_URL, null) ||
          (uid ? "https://cdwstvsesiyvfcadyqzs.supabase.co/storage/v1/object/public/avatars/" + uid + "/avatar.jpg" : null);
      } catch (error) { remoteAvatar = read(KEY_AVATAR_URL, null); }

      function renderProfile() {
        const avatar = document.getElementById("avatar");
        const photo = preferLocal ? read(KEY_AVATAR, null) : (remoteAvatar || read(KEY_AVATAR, null));

        avatar.innerHTML = "";

        if (photo) {
          const image = el("img", { src: photo, alt: "Your profile photo" });
          image.addEventListener("error", function () {
            const back = read(KEY_AVATAR, null);
            if (back && image.src !== back) { image.src = back; } else { avatar.textContent = initials(user.name); }
          });
          avatar.appendChild(image);
        } else {
          avatar.textContent = initials(user.name);
        }

        document.getElementById("profileName").textContent =
          user.name || "BODEGS member";

        document.getElementById("profileEmail").textContent = user.email || "";

        const orders = read("weraeOrders", []);
        const cart = read("weraeCart", []);

        document.getElementById("profilePill").textContent =
          "BODEGS member";

        document.getElementById("ordersCount").textContent =
          orders.length === 1 ? "1 order" : orders.length + " orders";

        const cartTotal = cart.reduce(function (t, i) { return t + Number((i && i.quantity) || 1); }, 0);
        document.getElementById("cartCount").textContent =
          cartTotal === 1 ? "1 item" : cartTotal + " items";
      }

      /* Profile photo: resized to a small square, shown at once, and saved to your account so it follows you */

      async function uploadAvatar(blob) {
        try {
          const got = await sb.auth.getUser();
          const id = got && got.data && got.data.user && got.data.user.id;
          if (!id || !blob) throw new Error("no account");
          const path = id + "/avatar.jpg";
          const up = await sb.storage.from("avatars").upload(path, blob, { upsert: true, contentType: "image/jpeg", cacheControl: "3600" });
          if (up.error) throw up.error;
          const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
          const meta = await sb.auth.updateUser({ data: { bodegs_photo: url } });
          if (meta.error) throw meta.error;
          remoteAvatar = url;
          write(KEY_AVATAR_URL, url);
          preferLocal = false;
          toast("Profile photo updated");
        } catch (error) {
          toast("Photo saved on this phone only" + (error && error.message ? " (" + error.message + ")" : ""));
        }
      }

      (async function loadRemoteAvatar() {
        try {
          const got = await sb.auth.getUser();
          const meta = got && got.data && got.data.user && got.data.user.user_metadata;
          if (meta && meta.bodegs_photo && !preferLocal) {
            remoteAvatar = meta.bodegs_photo;
            write(KEY_AVATAR_URL, meta.bodegs_photo);
            renderProfile();
          }
        } catch (error) {}
      })();

      const avatarInput = document.getElementById("avatarInput");

      document.getElementById("avatarEdit").addEventListener("click", function () {
        avatarInput.click();
      });

      avatarInput.addEventListener("change", function () {
        const file = avatarInput.files && avatarInput.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = function () {
          const image = new Image();

          image.onload = function () {
            const size = 240;
            const canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;

            const side = Math.min(image.width, image.height);
            const sx = (image.width - side) / 2;
            const sy = (image.height - side) / 2;

            canvas.getContext("2d").drawImage(image, sx, sy, side, side, 0, 0, size, size);

            if (!write(KEY_AVATAR, canvas.toDataURL("image/jpeg", 0.82))) {
              toast("Could not save the photo on this device");
              return;
            }
            preferLocal = true;
            renderProfile();
            canvas.toBlob(function (blob) { uploadAvatar(blob); }, "image/jpeg", 0.82);
          };

          image.src = reader.result;
        };

        reader.readAsDataURL(file);
        avatarInput.value = "";
      });
            /* ---------- sheets ---------- */

      function field(label, type, value, readonly) {
        const input = el("input", { type: type, value: value || "" });
        if (readonly) input.setAttribute("readonly", "readonly");
        return {
          input: input,
          node: el("label", { class: "field" }, [el("span", { text: label }), input])
        };
      }

      function editProfileSheet() {
        openSheet("Edit Profile", function (body) {
          const name = field("Full name", "text", user.name, false);
          const email = field("Email", "email", user.email, true);
          const phone = field("Phone number", "tel", user.phone, false);
          const save = el("button", { class: "primary-btn", type: "button", text: "Save changes" });

          save.addEventListener("click", function () {
            const newName = name.input.value.trim();

            if (!newName) {
              toast("Please enter your name");
              return;
            }

            user.name = newName;
            user.phone = phone.input.value.trim();
            write(KEY_USER, user);
            renderProfile();
            closeSheet();
            toast("Profile saved");
          });

          [name.node, email.node, phone.node, save].forEach(function (node) {
            body.appendChild(node);
          });
        });
      }

      function addressesSheet() {
        openSheet("Delivery Addresses", function (body) {

          function draw() {
            body.innerHTML = "";

            const addresses = read(KEY_ADDRESSES, []);

            if (!addresses.length) {
              body.appendChild(el("p", { class: "empty-note", text: "You have not added a delivery address yet." }));
            }

            addresses.forEach(function (address) {
              const removeBtn = el("button", { class: "link-btn", type: "button", text: "Remove" });

              removeBtn.addEventListener("click", function () {
                write(
                  KEY_ADDRESSES,
                  read(KEY_ADDRESSES, []).filter(function (item) {
                    return item.id !== address.id;
                  })
                );
                draw();
              });

              body.appendChild(
                el("div", { class: "list-item" }, [
                  el("div", { class: "grow" }, [
                    el("strong", { text: address.label }),
                    el("small", { text: address.line + ", " + address.city })
                  ]),
                  removeBtn
                ])
              );
            });

            body.appendChild(el("p", { class: "sheet-subtitle", text: "Add a new address" }));

            const label = field("Label (for example Home or Work)", "text", "", false);
            const line = field("Street address", "text", "", false);
            const city = field("City", "text", "", false);
            const add = el("button", { class: "primary-btn", type: "button", text: "Save address" });

            add.addEventListener("click", function () {
              if (!line.input.value.trim() || !city.input.value.trim()) {
                toast("Please enter the street and city");
                return;
              }

              const list = read(KEY_ADDRESSES, []);

              list.push({
                id: String(Date.now()),
                label: label.input.value.trim() || "Address",
                line: line.input.value.trim(),
                city: city.input.value.trim()
              });

              write(KEY_ADDRESSES, list);
              draw();
              toast("Address saved");
            });

            [label.node, line.node, city.node, add].forEach(function (node) {
              body.appendChild(node);
            });
          }

          draw();
        });
      }

      function verificationSheet() {
        openSheet("Verification status", function (body) {
          const hasAddress = read(KEY_ADDRESSES, []).length > 0;

      /* Log out of the real BODEGS account (Supabase), clear this device's copy, then go to Home. */
      async function endSession() {

      /* ---------- confirmation pop-up ---------- */
      function confirmBox(title, text, yesLabel, danger) {
        return new Promise(function (resolve) {
          const back = document.getElementById("cfBack");
          const yes = document.getElementById("cfYes");
          const no = document.getElementById("cfNo");
          document.getElementById("cfTitle").textContent = title;
          document.getElementById("cfText").textContent = text;
          yes.textContent = yesLabel;
          yes.className = "cf-yes" + (danger ? " danger" : "");
          back.hidden = false;
          function done(v) {
            back.hidden = true;
            yes.onclick = null; no.onclick = null; back.onclick = null;
            resolve(v);
          }
          yes.onclick = function () { done(true); };
          no.onclick = function () { done(false); };
          back.onclick = function (e) { if (e.target === back) done(false); };
        });
      }

      async function confirmedSignOut() {
        const ok = await confirmBox("Log out?", "You will need to sign in again to see your orders and cart.", "Log out", false);
        if (!ok) return;
        await endSession();
        window.location.href = "index.html";

      async function confirmedDelete() {
        const ok = await confirmBox(
          "Delete your account?",

        );
        if (!ok) return;
        try {
          const res = await sb.rpc("request_account_deletion");
          if (res.error) throw res.error;
        } catch (error) {
          toast("Could not delete the account right now. Please try again.");
          return;

        try {
          const got = await sb.auth.getUser();
          if (got && got.data && got.data.user) await sb.storage.from("avatars").remove([got.data.user.id + "/avatar.jpg"]);
        } catch (error) {}
        await endSession();
        remove(KEY_USER);
        remove(KEY_ADDRESSES);
        remove(KEY_AVATAR);
        remove(KEY_AVATAR_URL);
        remove("weraeRememberedEmail");
        window.location.href = "index.html";

          body.appendChild(el("p", { text: "How is your BODEGS experience?" }));
          const row = el("div", { class: "fb-stars" });
          const btns = [1, 2, 3, 4, 5].map(function (n) {
            const b = el("button", { type: "button", text: "★" });
            b.setAttribute("aria-label", n + " star" + (n > 1 ? "s" : ""));
            b.addEventListener("click", function () {
              stars = n;
              btns.forEach(function (x, i) { x.className = i < n ? "on" : ""; });
            });
            row.appendChild(b);
            return b;
          });
          body.appendChild(row);
          const text = el("textarea", { class: "fb-text", placeholder: "Tell us what we can do better (optional)" });
          body.appendChild(text);
          const send = el("button", { class: "fb-send", type: "button", text: "Send feedback" });
          send.addEventListener("click", function () {
            if (!stars && !text.value.trim()) { toast("Add a rating or a message first"); return; }
            const msg = "BODEGS feedback\nRating: " + (stars || "-") + "/5\n" + text.value.trim();
            const list = read("bodegsFeedback", []);
            list.push({ stars: stars, text: text.value.trim(), at: Date.now() });
            write("bodegsFeedback", list);
            if (SUPPORT.whatsapp) { window.open("https://wa.me/" + SUPPORT.whatsapp.replace(/\D/g, "") + "?text=" + encodeURIComponent(msg), "_blank"); }
            else if (SUPPORT.email) { window.location.href = "mailto:" + SUPPORT.email + "?subject=" + encodeURIComponent("BODEGS feedback") + "&body=" + encodeURIComponent(msg); }
            closeSheet();
            toast("Thank you for your feedback");
          });
          body.appendChild(send);
        });
      }

      /* Settings is its own "page" in the browser history, so the phone's Back button closes it
         (instead of leaving Profile) and a reload keeps you inside Settings. */
      function showSettings() {
        settingsPage.hidden = false;
        document.body.classList.add("st-open");
        settingsPage.scrollTop = 0;
      }
      function hideSettings() {
        settingsPage.hidden = true;
        document.body.classList.remove("st-open");
      }
      function openSettings() {
        if (location.hash !== "#settings") {
          try { history.pushState({ settings: 1 }, "", "#settings"); } catch (error) {}
        }
        showSettings();
      }
      function closeSettings() {
        if (location.hash === "#settings") { history.back(); }
        else { hideSettings(); }
      }
      window.addEventListener("popstate", function () {
        if (location.hash === "#settings") showSettings();
        else hideSettings();
      });

      (function buildSettings() {
        const wrap = document.getElementById("stWrap");
        const chev = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';

        const ap = el("div", { class: "st-group st-ap" });
        ap.appendChild(el("strong", { text: "Appearance" }));
        if (window.BODEGSTheme && window.BODEGSTheme.toggle) ap.appendChild(window.BODEGSTheme.toggle());
        wrap.appendChild(ap);

        function group(rows) {
          const g = el("div", { class: "st-group" });
          rows.forEach(function (r) {
            const b = el("button", { class: "st-row" + (r[2] ? " danger" : ""), type: "button" });
            b.innerHTML = "<span></span>" + (r[2] ? "" : chev);
            b.querySelector("span").textContent = r[0];
            b.addEventListener("click", r[1]);
            g.appendChild(b);
          });
          wrap.appendChild(g);
        }

        group([
          ["Terms & Conditions", termsSheet],
          ["Privacy & Cookie Policy", privacySheet],
          ["Rating & Feedback", feedbackSheet],
          ["About BODEGS", aboutSheet],
          ["Manage Cookies", cookiesSheet]
        ]);
        group([["Log out", confirmedSignOut]]);
        group([["Delete account", confirmedDelete, true]]);
      })();

      document.getElementById("gearBtn").addEventListener("click", openSettings);
      if (location.hash === "#settings") showSettings();
      document.getElementById("stBack").addEventListener("click", closeSettings);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && sheet.hidden && !settingsPage.hidden) closeSettings();
      });

      /* ---------- menu ---------- */

      const MENU = [
        { icon: "shield", title: "Open a Boutique on BODEGS", sub: "Apply to sell on BODEGS", href: "boutique.html" },
        { icon: "user", title: "Edit Profile", action: editProfileSheet },
        { icon: "pin", title: "Delivery Address List", sub: "Manage delivery addresses", action: addressesSheet },
        { icon: "shield", title: "Verification status", sub: "Check your account details", action: verificationSheet },
        { icon: "orders", title: "Order History", sub: "See and track your orders", href: "orders.html" },
        { icon: "help", title: "FAQs", sub: "Read answers to frequently asked questions", action: faqSheet },
        { icon: "play", title: "How BODEGS works", sub: "A quick guide to buying on BODEGS", action: howItWorksSheet }
      ];

      const menu = document.getElementById("menu");

      MENU.forEach(function (item) {
        const row = el(item.href ? "a" : "button", {
          class: "menu-row" + (item.danger ? " danger" : "")
        });

        if (item.href) {
          row.setAttribute("href", item.href);
          row.style.textDecoration = "none";
        } else {
          row.setAttribute("type", "button");
          row.addEventListener("click", item.action);
        }

        row.innerHTML =
          svg(item.icon, "menu-icon") +
          '<span class="menu-text"><strong></strong>' +
          (item.sub ? "<small></small>" : "") +
          "</span>" +
          svg("chevron", "menu-chevron");

        row.querySelector("strong").textContent = item.title;
        if (item.sub) row.querySelector("small").textContent = item.sub;

        menu.appendChild(row);
      });

      /* ---------- support card (only shows what you filled in) ---------- */

      (function buildSupport() {
        const buttons = document.getElementById("supportButtons");
        const social = document.getElementById("socialRow");
        let shown = 0;

        function supportLink(icon, label, href) {
          const link = el("a", { class: "support-btn", href: href });
          link.innerHTML = svg(icon, "");
          link.appendChild(document.createTextNode(label));
          buttons.appendChild(link);
          shown++;
        }

        if (SUPPORT.phone) supportLink("phone", "Call us", "tel:+" + SUPPORT.phone.replace(/\D/g, ""));
        if (SUPPORT.whatsapp) supportLink("chat", "Chat on WhatsApp", "https://wa.me/" + SUPPORT.whatsapp.replace(/\D/g, ""));
        if (SUPPORT.email) supportLink("mail", "Email us", "mailto:" + SUPPORT.email);

        [["instagram", "Instagram"], ["facebook", "Facebook"], ["tiktok", "TikTok"]].forEach(function (pair) {
          if (SUPPORT[pair[0]]) {
            social.appendChild(
              el("a", { href: SUPPORT[pair[0]], target: "_blank", rel: "noopener", text: pair[1] })
            );
            shown++;
          }
        });

        if (shown) {
          if (!social.children.length) {
            social.remove();
          }
          document.getElementById("support").hidden = false;
        }
      })();

      renderProfile();
      try { window.scrollTo(0, 0); } catch (error) {}

    })();
  </script>

  <script src="nav.js?v=7"></script>
</body>
