<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — BODEGS</title>
  <style>
    :root { --ink:#111; --muted:#6b7280; --line:#e5e7eb; --bg:#f5f5f7; --green:#166534; --red:#b91c1c; --amber:#92400e; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--ink); }

    header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); padding: 12px 16px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .top h1 { font-size: 17px; margin: 0; }
    .top a { color: var(--muted); font-size: 14px; text-decoration: none; }
    .top { justify-content: flex-start; }
    .top h1 { flex: 1; }
    .menubtn { flex: none; width: 40px; height: 40px; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer; padding: 0; }
    .menubtn i { display: block; width: 18px; height: 2px; background: var(--ink); border-radius: 2px; }
    #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
    .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 80%; max-width: 300px; background: #fff; z-index: 21; padding: 18px 12px; transform: translateX(-105%); transition: transform .22s ease; overflow-y: auto; box-shadow: 2px 0 14px rgba(0,0,0,.15); }
    .drawer.open { transform: none; }
    .drawer h3 { margin: 4px 8px 14px; font-size: 17px; }
    .tab { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 13px 12px; margin: 2px 0; font-size: 15px; text-align: left; font-family: inherit; border: 0; background: transparent; border-radius: 10px; cursor: pointer; color: var(--ink); }
    .tab.on { background: var(--ink); color: #fff; }
    .tab .cnt { font-size: 12px; font-weight: 700; background: #ef4444; color: #fff; border-radius: 99px; padding: 2px 8px; }
    .tab .cnt:empty { display: none; }
    .tab hr { display: none; }
    .drawer .sep { height: 1px; background: var(--line); margin: 8px 10px; }
    #attn { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    #attn button { border: 0; border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 700; background: #fee2e2; color: #991b1b; cursor: pointer; }
    #attn button.soft { background: #e0e7ff; color: #3730a3; }
    .home { display: flex; flex-direction: column; gap: 12px; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile { background: #fff; border: 0; border-radius: 14px; padding: 12px; text-align: left; font-family: inherit; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .tile .n { font-size: 24px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
    .tile .l { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .tile .h { font-size: 11px; color: #6366f1; margin-top: 4px; }
    .card { background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .card h2 { margin: 0 0 4px; font-size: 15px; }
    .seg { display: flex; gap: 6px; margin-bottom: 8px; }
    .seg button { flex: 1; padding: 8px; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; font: inherit; font-size: 13px; cursor: pointer; }
    .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .slides::-webkit-scrollbar { display: none; }
    .slide { flex: 0 0 100%; scroll-snap-align: start; }
    .slide svg { width: 100%; height: auto; display: block; }
    .cap { font-size: 12.5px; color: var(--muted); line-height: 1.5; min-height: 38px; }
    .cap b { color: var(--ink); }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin: 4px 0; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; }
    .meter { margin: 10px 0; }
    .meter .row { display: flex; justify-content: space-between; font-size: 13px; }
    .meter .bar { height: 8px; background: #eceef2; border-radius: 99px; overflow: hidden; margin-top: 4px; }
    .meter .bar i { display: block; height: 100%; background: #22c55e; border-radius: 99px; }
    .meter .bar i.warn { background: #f59e0b; } .meter .bar i.bad { background: #ef4444; }
    .costform { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .costform input { width: 100%; padding: 11px 12px; font: inherit; font-size: 14px; border: 1.5px solid var(--line); border-radius: 10px; }
    .costform .wide { grid-column: 1 / -1; }
    .costrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .costrow small { display: block; color: var(--muted); font-size: 12px; }
    .costrow button { border: 0; background: transparent; color: var(--red); font: inherit; font-size: 13px; cursor: pointer; }

    main { max-width: 640px; margin: 0 auto; padding: 16px 16px 60px; }
    .note { text-align: center; color: var(--muted); font-size: 14px; padding: 36px 12px; line-height: 1.5; }
    .note.err { color: var(--red); }

    .app { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .app-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .app-head h2 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
    .badge { flex: none; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: #fef3c7; color: var(--amber); }
    .badge.approved { background: #dcfce7; color: var(--green); }
    .badge.rejected { background: #fee2e2; color: var(--red); }
    .badge.active { background: #dcfce7; color: var(--green); }
    .badge.suspended { background: #fef3c7; color: var(--amber); }
    .badge.banned { background: #fee2e2; color: var(--red); }
    .btn.suspend { background: #fff; color: var(--amber); border: 1.5px solid #fde68a; }
    .btn.ban { background: var(--red); color: #fff; }
    .sub { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
    dl { margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    dd a { color: #1d4ed8; }
    .about { margin: 12px 0 0; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: #f9fafb; padding: 10px 12px; border-radius: 10px; }

    .docs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .docbtn { padding: 9px 12px; font-size: 13px; font-family: inherit; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; cursor: pointer; color: var(--ink); }
    .docview { margin-top: 10px; }
    .docview img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
    .docview a { color: #1d4ed8; font-size: 14px; }
    .docview p { font-size: 13px; color: var(--muted); margin: 0 0 6px; }

    .actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn { flex: 1; padding: 13px; font-size: 15px; font-weight: 600; font-family: inherit; border: 0; border-radius: 10px; cursor: pointer; }
    .btn.approve { background: var(--green); color: #fff; }
    .btn.reject { background: #fff; color: var(--red); border: 1.5px solid #fecaca; }
    .btn:disabled { opacity: .55; }
    .warn { margin-top: 12px; font-size: 13px; color: var(--amber); background: #fffbeb; border: 1px solid #fde68a; padding: 10px 12px; border-radius: 10px; overflow-wrap: anywhere; }
    .reason { margin-top: 12px; font-size: 13px; color: var(--red); background: #fef2f2; padding: 10px 12px; border-radius: 10px; overflow-wrap: anywhere; }

    .stage { display: inline-block; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 99px; background: #e0e7ff; color: #3730a3; }
    .stage.bad { background: #fee2e2; color: var(--red); }
    .stage.ok { background: #dcfce7; color: var(--green); }
    .hubnote { width: 100%; margin-top: 12px; padding: 11px 12px; font-size: 14px; font-family: inherit; border: 1.5px solid var(--line); border-radius: 10px; }
    .btn.pass { background: var(--green); color: #fff; }
    .btn.go { background: var(--ink); color: #fff; }

    .app { padding: 12px 14px; margin-bottom: 10px; border-radius: 14px; }
    .app-head h2 { font-size: 16px; }
    .app-head { cursor: pointer; }
    .badge, .stage { font-size: 11.5px; padding: 4px 9px; }
    .sub { margin: 2px 0 0; font-size: 12.5px; }
    .app .detail { margin-top: 10px; }
    .app dl { font-size: 13px; gap: 3px 8px; grid-template-columns: 84px 1fr; }
    .app .actions { margin-top: 12px; }
    .app .btn { padding: 10px; font-size: 14px; }
    .chev { flex: none; color: var(--muted); font-size: 14px; margin-left: 6px; }
    .hubhead { align-items: center; }
    .hubtitle { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .hubitems { margin-top: 8px; }
    .hubitem { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
    .hubimg { flex: none; width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #eee; }
    .hubbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
    .hubbody b { font-size: 14px; overflow-wrap: anywhere; }
    .sub2 { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .notel { margin: 0 0 4px 54px; }
    .stage.mini { font-size: 11px; padding: 2px 8px; }
    .stage.wait { background: #fef3c7; color: var(--amber); }
    .btn.small { flex: none; padding: 8px 12px; font-size: 13px; }
    .btn.small.send { width: 100%; margin-top: 8px; padding: 11px; font-size: 14px; }
    .linkbtn { background: none; border: 0; padding: 0 0 6px 54px; font: inherit; font-size: 12px; color: #1d4ed8; cursor: pointer; display: block; }
    .hubnote { margin: 0 0 6px 54px; width: calc(100% - 54px); padding: 8px 10px; font-size: 13px; }
    #hubbar { margin-top: 10px; }
    #hubSearch { width: 100%; padding: 11px 12px; font-size: 15px; font-family: inherit; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
    .chips { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; padding-bottom: 2px; }
    .chip { flex: none; padding: 7px 12px; font-size: 13px; font-family: inherit; border: 1.5px solid var(--line); background: #fff; border-radius: 99px; cursor: pointer; }
    .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    #toast { position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 440px; margin: 0 auto; padding: 13px 15px; border-radius: 12px; font-size: 14px; background: #111; color: #fff; z-index: 9; }
    #toast.err { background: var(--red); }
  </style>
</head>
<body style="overflow-x:hidden">

<header>
  <div class="top">
    <button type="button" class="menubtn" id="menuBtn" aria-label="Menu"><i></i><i></i><i></i></button>
    <h1 id="title">Home</h1>
    <a href="profile.html">Profile</a>
  </div>
  <div id="attn" hidden></div>
  <div id="hubbar" hidden>
    <input type="search" id="hubSearch" placeholder="Search order number, product, seller, phone" autocomplete="off">
    <div class="chips" id="hubChips">
      <button type="button" class="chip on" data-f="all">All</button>
      <button type="button" class="chip" data-f="receive">Waiting for items</button>
      <button type="button" class="chip" data-f="send">Ready to send</button>
      <button type="button" class="chip" data-f="wait">With buyer</button>
    </div>
  </div>
</header>
<div id="scrim" hidden></div>
<nav class="drawer" id="tabs" aria-label="Admin menu" hidden>
  <h3>BODEGS Admin</h3>
  <button type="button" class="tab on" data-status="home">Home</button>
  <button type="button" class="tab" data-status="hub">Hub <span class="cnt" id="cHub"></span></button>
  <button type="button" class="tab" data-status="pending">Approve sellers <span class="cnt" id="cPending"></span></button>
  <button type="button" class="tab" data-status="reports">Reports <span class="cnt" id="cRep"></span></button>
  <div class="sep"></div>
  <button type="button" class="tab" data-status="sellers">Sellers</button>
  <button type="button" class="tab" data-status="approved">Approved applications</button>
  <button type="button" class="tab" data-status="rejected">Rejected applications</button>
  <div class="sep"></div>
  <button type="button" class="tab" data-status="costs">Costs</button>
</nav>

<main id="list"><p class="note">Checking access...</p></main>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let status = "home";
  const TITLES = { home: "Home", hub: "Hub", pending: "Approve sellers", reports: "Reports", sellers: "Sellers", approved: "Approved applications", rejected: "Rejected applications", costs: "Costs" };
  let ownerBoutiques = {};

  function toast(text, isError) {
    const t = $("toast");
    t.textContent = text;
    t.className = isError ? "err" : "";
    t.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.hidden = true; }, 4000);
  }

  function note(text, isError) {
    const list = $("list");
    list.textContent = "";
    const p = document.createElement("p");
    p.className = "note" + (isError ? " err" : "");
    p.textContent = text;
    list.appendChild(p);
  }

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function row(dl, label, value, href) {
    if (!value) return;
    dl.appendChild(el("dt", "", label));
    const dd = el("dd");
    if (href) {
      const a = el("a", "", value);
      a.href = href;
      dd.appendChild(a);
    } else {
      dd.textContent = value;
    }
    dl.appendChild(dd);
  }

  function formatDate(value) {
    const d = new Date(value);
    return isNaN(d) ? "" : d.toLocaleDateString("en-NG", { day: "numeric", month: "short", year: "numeric" });
  }

  // Show a private document. Images appear on the page. PDFs get a link.
  async function showDoc(path, label, box) {
    box.textContent = "";
    box.appendChild(el("p", "", "Loading " + label + "..."));
    const { data, error } = await sb.storage.from("seller-docs").createSignedUrl(path, 300);
    box.textContent = "";
    if (error || !data) {
      box.appendChild(el("p", "", "Could not open this document."));
      return;
    }
    box.appendChild(el("p", "", label + " (link works for 5 minutes)"));
    if (/\.pdf$/i.test(path)) {
      const a = el("a", "", "Open PDF");
      a.href = data.signedUrl;
      a.target = "_blank";
      a.rel = "noopener";
      box.appendChild(a);
    } else {
      const img = document.createElement("img");
      img.src = data.signedUrl;
      img.alt = label;
      box.appendChild(img);
    }
  }

  function card(app) {
    const wrap = el("article", "app");

    const head = el("div", "app-head");
    head.appendChild(el("h2", "", app.boutique_name));
    head.appendChild(el("span", "badge " + app.status, app.status.charAt(0).toUpperCase() + app.status.slice(1)));
    wrap.appendChild(head);
    wrap.appendChild(el("p", "sub", "Applied " + formatDate(app.created_at)));

    const dl = el("dl");
    row(dl, "Name", app.full_name);
    row(dl, "Phone", app.phone, "tel:" + app.phone.replace(/[^\d+]/g, ""));
    row(dl, "Email", app.email, "mailto:" + app.email);
    row(dl, "City", app.city);
    row(dl, "Category", app.category);
    row(dl, "CAC number", app.cac_number);
    row(dl, "Social", app.social);
    wrap.appendChild(dl);
    wrap.appendChild(el("p", "about", app.about));

    const docs = el("div", "docs");
    const view = el("div", "docview");
    [["ID", app.id_doc_path, "Government ID"],
     ["CAC certificate", app.cac_doc_path, "CAC certificate"],
     ["Address proof", app.address_doc_path, "Address proof"]].forEach(([text, path, label]) => {
      if (!path) return;
      const b = el("button", "docbtn", "View " + text);
      b.type = "button";
      b.addEventListener("click", () => showDoc(path, label, view));
      docs.appendChild(b);
    });
    wrap.appendChild(docs);
    wrap.appendChild(view);

    if (app.status === "rejected" && app.rejection_reason) {
      wrap.appendChild(el("p", "reason", "Reason: " + app.rejection_reason));
    }

    if (app.status === "pending") {
      const existing = ownerBoutiques[app.user_id];
      if (existing) {
        wrap.appendChild(el("p", "warn",
          "Heads up: this account already owns a boutique (" + existing +
          "). Approving this will not create another one."));
      }
      const actions = el("div", "actions");
      const reject = el("button", "btn reject", "Reject");
      const approve = el("button", "btn approve", "Approve");
      reject.type = approve.type = "button";

      approve.addEventListener("click", async () => {
        if (!confirm("Approve " + app.boutique_name + "? They will become a verified seller.")) return;
        approve.disabled = reject.disabled = true;
        const { error } = await sb.rpc("approve_application", { app_id: app.id });
        if (error) { toast("Could not approve: " + error.message, true); approve.disabled = reject.disabled = false; return; }
        toast(app.boutique_name + " approved.");
        load();
      });

      reject.addEventListener("click", async () => {
        const reason = (prompt("Why are you rejecting " + app.boutique_name + "? The reason is saved with the application.") || "").trim();
        if (!reason) { toast("A reason is required to reject.", true); return; }
        approve.disabled = reject.disabled = true;
        const { error } = await sb.rpc("reject_application", { app_id: app.id, reason: reason });
        if (error) { toast("Could not reject: " + error.message, true); approve.disabled = reject.disabled = false; return; }
        toast(app.boutique_name + " rejected.");
        load();
      });

      actions.appendChild(reject);
      actions.appendChild(approve);
      wrap.appendChild(actions);
    }
    return wrap;
  }

  // ---- Sellers tab: suspend, ban, reinstate ----
  const STATUS_WORD = { active: "Active", suspended: "Suspended", banned: "Banned" };

  async function changeSeller(s, newStatus, reason, button, siblings) {
    siblings.forEach((b) => { b.disabled = true; });
    const { error } = await sb.rpc("set_seller_status", { p_seller: s.id, p_status: newStatus, p_reason: reason });
    if (error) {
      toast("Could not update: " + error.message, true);
      siblings.forEach((b) => { b.disabled = false; });
      return;
    }
    toast(s.boutique_name + " is now " + newStatus + ".");
    load();
  }

  function sellerCard(s, contact, last) {
    const st = s.status || "active";
    const wrap = el("article", "app");
    const head = el("div", "app-head");
    head.appendChild(el("h2", "", s.boutique_name));
    head.appendChild(el("span", "badge " + st, STATUS_WORD[st] || st));
    wrap.appendChild(head);
    wrap.appendChild(el("p", "sub", "Seller since " + formatDate(s.created_at)));

    const dl = el("dl");
    if (contact) {
      row(dl, "Name", contact.full_name);
      row(dl, "Phone", contact.phone, contact.phone ? "tel:" + contact.phone.replace(/[^\d+]/g, "") : "");
      row(dl, "Email", contact.email, contact.email ? "mailto:" + contact.email : "");
    }
    row(dl, "City", s.city);
    row(dl, "Category", s.category);
    wrap.appendChild(dl);

    if (st !== "active" && last) {
      wrap.appendChild(el("p", "reason", "Reason (" + formatDate(last.created_at) + "): " + last.reason));
    }

    const actions = el("div", "actions");
    const buttons = [];
    function add(cls, label, fn) {
      const b = el("button", "btn " + cls, label);
      b.type = "button";
      b.addEventListener("click", () => fn(b));
      buttons.push(b);
      actions.appendChild(b);
    }
    function ask(verb, newStatus, needsConfirm) {
      return (b) => {
        const reason = (prompt("Why are you " + verb + " " + s.boutique_name + "? The reason is saved.") || "").trim();
        if (!reason) { toast("A reason is required.", true); return; }
        if (needsConfirm && !confirm("Ban " + s.boutique_name + "? Their products will disappear from the shop and they cannot sell.")) return;
        changeSeller(s, newStatus, reason, b, buttons);
      };
    }
    if (st === "active") {
      add("suspend", "Suspend", ask("suspending", "suspended", false));
      add("ban", "Ban", ask("banning", "banned", true));
    } else if (st === "suspended") {
      add("approve", "Reinstate", (b) => {
        if (!confirm("Reinstate " + s.boutique_name + "?")) return;
        changeSeller(s, "active", "", b, buttons);
      });
      add("ban", "Ban", ask("banning", "banned", true));
    } else {
      add("approve", "Reinstate", (b) => {
        if (!confirm("Reinstate " + s.boutique_name + "? Their products will show in the shop again.")) return;
        changeSeller(s, "active", "", b, buttons);
      });
    }
    wrap.appendChild(actions);
    return wrap;
  }

  async function loadSellers() {
    const [sr, ar, mr] = await Promise.all([
      sb.from("sellers").select("id, owner_id, boutique_name, city, category, status, created_at").order("created_at", { ascending: false }),
      sb.from("seller_applications").select("user_id, full_name, phone, email, status"),
      sb.from("seller_moderation").select("seller_id, action, reason, created_at").order("created_at", { ascending: false })
    ]);
    if (sr.error) { note("Could not load sellers. Please try again.", true); return; }
    const contacts = {};
    (ar.data || []).forEach((a) => { if (a.status === "approved") contacts[a.user_id] = a; });
    const lastNote = {};
    (mr.data || []).forEach((m) => { if (!lastNote[m.seller_id]) lastNote[m.seller_id] = m; });
    const list = $("list");
    list.textContent = "";

  // ---------- Hub: one card per ORDER, listing every item from every seller ----------
  let hubData = [], hubFilter = "all";

  function itemState(r) {
    if (r.delivered_at) return ["Delivered", "ok"];
    if (r.dispatched_at) return ["Sent to buyer", "ok"];
    if (r.hub_result) return ["At hub, checked", "ok"];
    if (r.hub_received_at) return ["At hub", ""];
    if (r.shipped_at) return ["On its way to hub", "wait"];
    return ["Seller has not sent it", "bad"];
  }

  function groupOrders(rows) {
    const map = new Map();
    rows.forEach((r) => {
      if (!map.has(r.order_id)) map.set(r.order_id, { id: r.order_id, items: [], first: r });
      map.get(r.order_id).items.push(r);
    });
    return Array.from(map.values()).map((o) => {
      const open = o.items.filter((i) => !i.delivered_at);
      o.total = o.items.length;
      o.atHub = o.items.filter((i) => i.hub_result && !i.dispatched_at && !i.delivered_at).length;
      o.toReceive = o.items.filter((i) => i.shipped_at && !i.hub_received_at && !i.delivered_at).length;
      o.notSent = o.items.filter((i) => !i.shipped_at).length;
      o.sent = o.items.filter((i) => i.dispatched_at || i.delivered_at).length;
      o.group = o.atHub ? "send" : o.toReceive ? "receive" : open.length && open.every((i) => i.dispatched_at) ? "wait" : "receive";
      return o;
    });
  }

  function hubOrderCard(o) {

  function naira(n) {
    n = Number(n) || 0; const a = Math.abs(n);
    if (a >= 1e6) return "₦" + (n / 1e6).toFixed(a >= 1e7 ? 0 : 1) + "M";

  const SVGNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, text) {
    const e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach((k) => e.setAttribute(k, attrs[k]));
    if (text !== undefined) e.textContent = text;
    return e;
  }
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function monthName(ym) { const p = ym.split("-"); return MONTHS[Number(p[1]) - 1] + " " + p[0]; }

  // series: [{key,color,label}], stacked bars, one per month
  function chart(months, series, onPick) {
    const W = 340, H = 190, L = 40, B = 24, T = 10, R = 6;
    const totals = months.map((m) => series.reduce((t, x) => t + Number(m[x.key] || 0), 0));
    let max = Math.max.apply(null, totals.concat([1000]));
    const mag = Math.pow(10, Math.floor(Math.log10(max)));
    max = Math.ceil(max / mag * 2) / 2 * mag; // round up to a neat number
    const svg = sv("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
    for (let i = 0; i <= 4; i++) {
      const y = T + (H - T - B) * (1 - i / 4);
      svg.appendChild(sv("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: "#e5e7eb", "stroke-width": 1 }));
      svg.appendChild(sv("text", { x: L - 5, y: y + 4, "text-anchor": "end", "font-size": 10, fill: "#6b7280" }, naira(max * i / 4)));
    }
    const bw = (W - L - R) / months.length;
    months.forEach((m, i) => {
      let y = H - B;
      series.forEach((x) => {
        const h = (H - T - B) * (Number(m[x.key] || 0) / max);
        if (h > 0) { svg.appendChild(sv("rect", { x: L + i * bw + bw * 0.18, y: y - h, width: bw * 0.64, height: h, rx: 2, fill: x.color })); y -= h; }
      });
      const hit = sv("rect", { x: L + i * bw, y: T, width: bw, height: H - T - B, fill: "transparent", style: "cursor:pointer" });
      hit.addEventListener("click", () => onPick(i));
      svg.appendChild(hit);
      svg.appendChild(sv("text", { x: L + i * bw + bw / 2, y: H - 8, "text-anchor": "middle", "font-size": 10, fill: "#6b7280" }, MONTHS[Number(m.month.split("-")[1]) - 1][0]));
    });
    return svg;
  }

    return d;
  }

    add.addEventListener("click", async () => {
      add.disabled = true;
      const { data: r, error: e } = await sb.rpc("admin_add_cost", { p_date: dt.value || null, p_label: lb.value, p_amount: Number(am.value) });
      if (e || r !== "ok") { toast(r === "label_needed" ? "Write what it was for." : r === "bad_amount" ? "Enter a valid amount." : "Could not save.", true); add.disabled = false; return; }
      toast("Cost added."); loadCosts();
    });
    const hist = el("div", "card"); home.appendChild(hist);
    hist.appendChild(el("h2", "", "Recent costs"));
    if (!data.length) hist.appendChild(el("p", "cap", "Nothing yet."));
    data.forEach((c) => {
      const row = el("div", "costrow");
      const left = el("div"); left.appendChild(document.createTextNode(c.label)); left.appendChild(el("small", "", new Date(c.cost_date).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })));
      const right = el("div"); right.appendChild(el("b", "", nairaFull(c.amount)));
      const del = el("button", "", "Delete"); del.type = "button";
      del.addEventListener("click", async () => { if (!confirm("Delete this cost?")) return; await sb.rpc("admin_delete_cost", { p_id: c.id }); loadCosts(); });
      row.appendChild(left); row.appendChild(right); row.appendChild(del); hist.appendChild(row);
    });
  }

  async function load() {
    note("Loading...");
    $("title").textContent = TITLES[status] || "Admin";
    $("hubbar").hidden = status !== "hub";
    if (status !== "home") refreshAttn();
    if (status === "home") { return loadHome(); }
    if (status === "costs") { return loadCosts(); }
    if (status === "hub") { return loadHub(); }
    if (status === "reports") { return loadReports(); }
    if (status === "sellers") { return loadSellers(); }
    const { data, error } = await sb
      .from("seller_applications")
      .select("id, user_id, full_name, boutique_name, phone, email, city, category, about, social, cac_number, " +
              "id_doc_path, cac_doc_path, address_doc_path, status, rejection_reason, created_at")
      .order("created_at", { ascending: false });

    if (error) { note("Could not load applications. Please try again.", true); return; }

    // Which accounts already own a boutique? (Used for the warning on pending cards.)
    ownerBoutiques = {};
    const sellerResult = await sb.from("sellers").select("owner_id, boutique_name");
    if (!sellerResult.error && sellerResult.data) {
      sellerResult.data.forEach((s) => { ownerBoutiques[s.owner_id] = s.boutique_name; });
    }

    const pending = data.filter((a) => a.status === "pending").length;
    $("cPending").textContent = pending ? String(pending) : "";

    const shown = data.filter((a) => a.status === status);
    const list = $("list");
    list.textContent = "";
    if (!shown.length) { note("No " + status + " applications."); return; }
    shown.forEach((a) => list.appendChild(card(a)));
  }

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      status = tab.dataset.status;
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t === tab));
      openDrawer(false);
      window.scrollTo(0, 0);
      load();
    });
  });

  (async function start() {
    const user = await requireLogin();
    if (!user) return;

    const { data: profile, error } = await sb.from("profiles").select("role").eq("id", user.id).single();
    if (error || !profile || profile.role !== "admin") {
      note("This page is for BODEGS administrators only.", true);
      return;
    }
    $("tabs").hidden = false;
    load();
  })();
</script>
</body>
</html>
