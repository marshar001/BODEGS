  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="products.js?v=20261031"></script>
  <script>
// Product names, images and links come from sellers, so they are always
// escaped before being placed into the page.
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

// Only allow links to our own product pages.
function safeProductUrl(value) {
  const url = String(value || "");
  return /^product\.html\?id=[A-Za-z0-9_%\-]+$/.test(url) ? url : "explore.html";
}

const cartBackButton =
  document.getElementById("cartBackButton");

const lastProductPage =
  localStorage.getItem("weraeLastProductPage");

if (lastProductPage) {
  cartBackButton.href = lastProductPage;
}
    const recentlyViewedGrid =
      document.getElementById("recentlyViewedGrid");

    const recentlyViewedProducts = JSON.parse(
      localStorage.getItem("weraeRecentlyViewed") || "[]"
    );

    // Same card as the rest of the app. Full details come from the database;
    // if a product can no longer be found, the saved name, photo and price are used.
    function showRecentlyViewed() {
      recentlyViewedGrid.textContent = "";
      recentlyViewedProducts.forEach(saved => {
        const id = (String(saved.url || "").match(/id=([^&]+)/) || [])[1];
        let full = null;
        try {
          const all = (window.BODEGS && window.BODEGS.getAllProducts && window.BODEGS.getAllProducts()) || [];
          const key = id ? decodeURIComponent(id) : String(saved.productId || "");
          full = all.filter(p => String(p.id) === key)[0] || null;
        } catch (e) {}
        const product = full || {
          id: saved.productId, name: saved.name, priceText: saved.price,
          images: saved.image ? [saved.image] : []
        };
        const card = window.BODEGSCard.build(product);
        card.href = safeProductUrl(saved.url);
        recentlyViewedGrid.appendChild(card);
      });
    }
    if (window.BODEGS && window.BODEGS.ready) { window.BODEGS.ready.then(showRecentlyViewed); }
    else { showRecentlyViewed(); }
        const cartItems = document.getElementById("cartItems");

    const cartProducts = JSON.parse(
      localStorage.getItem("weraeCart") || "[]"
    );

        if (cartProducts.length === 0) {

  cartItems.innerHTML = `
    <div class="cart-empty">
      <h2>Your cart is empty</h2>
      <p>Add products to your cart and they will appear here.</p>

      <a href="index.html" class="continue-shopping">
        Start Shopping
      </a>
    </div>
  `;

} else {

    cartProducts.forEach((product, index) => {

    const numericPrice = Number(
  product.numericPrice ??
  String(product.price ?? 0).replace(/[^\d.]/g, "")
) || 0;
    const quantity = product.quantity || 1;
    const totalPrice = "₦" + (numericPrice * quantity).toLocaleString("en-NG");

    const item = document.createElement("article");

    item.className = "cart-swipe";

    item.innerHTML = `
      <button
        type="button"
        class="cart-swipe-delete"
        data-index="${index}"
        aria-label="Remove ${escapeHTML(product.name)}"
      >
        Remove
      </button>

      <div class="cart-product">

        <div class="cart-product-image">

          <img
            src="${escapeHTML(product.image)}"
            alt="${escapeHTML(product.name)}"
          >

          <label class="cart-product-select">
            <input
              type="checkbox"
              checked
              aria-label="Select ${escapeHTML(product.name)}"
            >
            <span></span>
          </label>

          <p class="cart-product-seller">
            ${escapeHTML(product.sellerName || "BODEGS seller")}
          </p>

        </div>

        <div class="cart-product-details">

          <h2>
            ${escapeHTML(product.name)}
          </h2>

          ${(product.size || product.color) ? `<p class="cart-product-seller">${[product.color ? "Color: " + escapeHTML(product.color) : "", product.size ? "Size: " + escapeHTML(product.size) : ""].filter(Boolean).join(" · ")}</p>` : ""}

          <p class="cart-product-price">
            ${totalPrice}
          </p>

          

          <div class="cart-product-controls">

            <button
              type="button"
              class="cart-quantity-minus"
              data-index="${index}"
              aria-label="Decrease quantity"
            >
              −
            </button>

            <span class="cart-quantity">
              ${Number(product.quantity) || 1}
            </span>

            <button
              type="button"
              class="cart-quantity-plus"
              data-index="${index}"
              aria-label="Increase quantity"
            >
              +
            </button>

          </div>

          <button
            type="button"
            class="cart-remove"
            data-index="${index}"
            aria-label="Remove ${escapeHTML(product.name)}"
          >
            Remove
          </button>

        </div>
      </div>
    `;

    cartItems.appendChild(item);

  });
        const orderSummary = document.createElement("section");
    orderSummary.className = "cart-order-summary";

    const cartSubtotal = cartProducts.reduce((total, product) => {
  const numericPrice = Number(
    product.numericPrice ??
    String(product.price ?? 0).replace(/[^\d.]/g, "")
  ) || 0;

  return total + numericPrice * (product.quantity || 1);
}, 0);

    const formattedSubtotal =
      "₦" + cartSubtotal.toLocaleString("en-NG");

    orderSummary.innerHTML = `
      <h2>Order Summary</h2>

      <div class="cart-summary-row">
        <span>Subtotal</span>
        <strong>${formattedSubtotal}</strong>
      </div>

      <div class="cart-summary-row">
        <span>Delivery</span>
        <strong>Calculated at checkout</strong>
      </div>

      <div class="cart-summary-total">
        <span>Total</span>
        <strong>${formattedSubtotal}</strong>
      </div>

      <button type="button" class="cart-checkout-button" id="cartCheckoutButton">
  Checkout
</button>
    `;

    cartItems.appendChild(orderSummary);
  document.querySelectorAll(".cart-quantity-minus").forEach(button => {

    button.addEventListener("click", () => {

      const index = Number(button.dataset.index);

      cartProducts[index].quantity =
        Math.max(1, (cartProducts[index].quantity || 1) - 1);

      localStorage.setItem(
        "weraeCart",
        JSON.stringify(cartProducts)
      );

      location.reload();

    });

  });

  document.querySelectorAll(".cart-quantity-plus").forEach(button => {

    button.addEventListener("click", () => {

      const index = Number(button.dataset.index);

      cartProducts[index].quantity =
        (cartProducts[index].quantity || 1) + 1;

      localStorage.setItem(
        "weraeCart",
        JSON.stringify(cartProducts)
      );

      location.reload();

    });

  });

    function confirmCartDelete(index) {

    const overlay = document.createElement("div");

    overlay.className = "cart-confirm-overlay";

    overlay.innerHTML = `
      <div class="cart-confirm-box">

        <h2>
          Are you sure you want to remove this item?
        </h2>

        <div class="cart-confirm-actions">

          <button
            type="button"
            class="cart-confirm-cancel"
          >
            Cancel
          </button>

          <button
            type="button"
            class="cart-confirm-delete"
          >
            Remove
          </button>

        </div>

      </div>
    `;

    document.body.appendChild(overlay);

    const closeDialog = () => {
      overlay.remove();
    };

    overlay
      .querySelector(".cart-confirm-cancel")
      .addEventListener("click", closeDialog);

    overlay.addEventListener("click", event => {
      if (event.target === overlay) {
        closeDialog();
      }
    });

    overlay
      .querySelector(".cart-confirm-delete")
      .addEventListener("click", () => {

        cartProducts.splice(index, 1);

        localStorage.setItem(
          "weraeCart",
          JSON.stringify(cartProducts)
        );

        location.reload();

      });

  }


  document.querySelectorAll(".cart-remove").forEach(button => {

    button.addEventListener("click", () => {

      const index = Number(button.dataset.index);

      confirmCartDelete(index);

    });

  });


  document.querySelectorAll(".cart-swipe-delete").forEach(button => {

    button.addEventListener("click", () => {

      const index = Number(button.dataset.index);

      confirmCartDelete(index);

    });

  });
  document.querySelectorAll(".cart-swipe").forEach(item => {

  const card = item.querySelector(".cart-product");

  let startX = 0;
  let currentX = 0;

  item.addEventListener("touchstart", event => {

    startX = event.touches[0].clientX;
    currentX = startX;

    card.style.transition = "none";

  }, { passive: true });

  item.addEventListener("touchmove", event => {

    currentX = event.touches[0].clientX;

    const distance = currentX - startX;

    if (distance < 0) {

      const move = Math.max(distance, -90);

      card.style.transform =
        `translateX(${move}px)`;

    }

  }, { passive: true });

  item.addEventListener("touchend", () => {

    const distance = currentX - startX;

    card.style.transition =
      "transform 0.2s ease";

    if (distance < -50) {

      card.style.transform =
        "translateX(-90px)";

      item.classList.add("swiped");

    } else {

      card.style.transform = "";

            item.classList.remove("swiped");

    }

  });

});

}

const cartCheckoutButton =
  document.getElementById("cartCheckoutButton");
if (cartCheckoutButton) {
  cartCheckoutButton.addEventListener("click", () => {
    window.location.href = "checkout.html";
  });
}
</script>
