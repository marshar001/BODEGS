<script>
    const ordersList = document.getElementById("ordersList");
    // The fixed top keeps the page colour so cards scroll cleanly underneath it.
    (function () {
      const top = document.getElementById("ordersTop");
      function paint() {
        if (top) top.style.setProperty("background-color", getComputedStyle(document.body).backgroundColor, "important");
      }
      paint();
      window.addEventListener("load", function () { setTimeout(paint, 700); });
    })();

    const filterButtons = document.querySelectorAll(".orders-filter");

    let currentFilter = "all";

    // Orders are loaded from the BODEGS database (see the bottom of this script).
    let loadedOrders = [];

    function readOrders() {
      return loadedOrders;
    }

    function formatMoney(value) {
      const amount = Number(
        String(value ?? 0).replace(/[^\d.-]/g, "")
      );

      return "₦" + (
        Number.isFinite(amount) ? amount : 0
      ).toLocaleString("en-NG");
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function normaliseStatus(status) {
      const value = String(status || "pending")
        .toLowerCase()
        .trim();

      if (value === "confirmed" || value === "processing") {
        return "processing";
      }

      if (value === "shipped" || value === "in transit") {
        return "shipped";
      }

      if (value === "delivered" || value === "completed") {
        return "delivered";
      }

      if (value === "cancelled" || value === "canceled") {
        return "cancelled";
      }

      return "pending";
    }

    // One label per order: unpaid orders stay "pending"; once paid, a new order
    // reads "Paid" and moves on to processing/shipped/delivered as the seller updates it.
    function orderStage(order) {
      const base = normaliseStatus(order.status);
      if (base === "cancelled") return { key: "cancelled", label: "Cancelled" };
      if (!order.paid) return { key: "pending", label: "Pending" };
      const lines = Array.isArray(order.products) ? order.products : [];
      if (lines.length && lines.every(p => p.delivered)) return { key: "delivered", label: "Delivered" };
      if (lines.length && lines.some(p => p.dispatched)) return { key: "shipped", label: "On its way" };
      if (lines.length && lines.some(p => p.atHub)) return { key: "processing", label: "At our hub", css: "paid" };
      if (base === "pending") return { key: "processing", label: "Paid", css: "paid" };
      return { key: base, label: base.charAt(0).toUpperCase() + base.slice(1) };
    }

    // True when BODEGS has sent something to the buyer and the buyer has not yet confirmed it arrived.
    function canConfirmReceipt(order) {
      if (!order.paid || normaliseStatus(order.status) === "cancelled") return false;
      const lines = Array.isArray(order.products) ? order.products : [];
      return lines.some(p => p.dispatched && !p.delivered);
    }

    function formatDate(value) {
      if (!value) return "Date unavailable";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return escapeHTML(value);
      }

      return date.toLocaleDateString("en-NG", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function calculateOrderTotal(order) {
      if (order.total !== undefined) {
        return Number(
          String(order.total).replace(/[^\d.-]/g, "")
        ) || 0;
      }

      if (order.totalAmount !== undefined) {
        return Number(
          String(order.totalAmount).replace(/[^\d.-]/g, "")
        ) || 0;
      }

      const products = Array.isArray(order.products)
        ? order.products
        : Array.isArray(order.items)
          ? order.items
          : [];

      return products.reduce((sum, product) => {
        const price = Number(
          String(product.price ?? 0).replace(/[^\d.-]/g, "")
        ) || 0;

        const quantity = Number(product.quantity) || 1;

        return sum + price * quantity;
      }, 0);
    }

    function renderEmptyState() {
      ordersList.innerHTML = `
        <div class="orders-empty">
          <div class="orders-empty-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3.5h12A1.5 1.5 0 0 1 19.5 5v14A1.5 1.5 0 0 1 18 20.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"></path>
              <path d="M8 8h8M8 12h8M8 16h5"></path>
            </svg>
          </div>

          <h2>No orders yet</h2>

          <p>
            Your purchases will appear here once you place
            an order. Discover something you love.
          </p>

          <a href="explore.html">Start Shopping</a>
        </div>
      `;
    }

    function renderOrders() {
      const allOrders = readOrders();

      const filteredOrders = currentFilter === "all"
        ? allOrders
        : allOrders.filter(order =>
            orderStage(order).key === currentFilter
          );

      if (allOrders.length === 0) {
        renderEmptyState();
        return;
      }

      if (filteredOrders.length === 0) {
        ordersList.innerHTML = `
          <div class="orders-message">
            No ${escapeHTML(currentFilter)} orders to show.
          </div>
        `;
        return;
      }

      ordersList.innerHTML = filteredOrders.map((order, index) => {
        const products = Array.isArray(order.products)
          ? order.products
          : Array.isArray(order.items)
            ? order.items
            : [];

        const stage = orderStage(order);
        const status = stage.key;

        const orderId = order.id ||
          order.orderId ||
          `ORDER-${String(index + 1).padStart(4, "0")}`;

        const date = order.date ||
          order.createdAt ||
          order.created_at;

        const total = calculateOrderTotal(order);

        const productMarkup = products.length
          ? products.map(product => {
              const name = escapeHTML(product.name || "Fashion item");
              const image = escapeHTML(product.image || " ");
              const quantity = Number(product.quantity) || 1;
              const price = Number(
                String(product.price ?? 0).replace(/[^\d.-]/g, "")
              ) || 0;

              return `
                <div class="order-product">
                  <img
                    src="${image}"
                    alt="${name}"
                    loading="lazy"
                    onerror="this.style.visibility='hidden'"

                  <div class="order-product-info">
                    <h3>${name}</h3>
                    <p>Quantity: ${quantity}</p>
                  </div>

                  <span class="order-product-price">
                    ${formatMoney(price * quantity)}

            }).join("")
          : `<p class="order-date">Order items unavailable</p>`;

        return `
          <article class="order-card${status === "cancelled" ? " is-cancelled" : ""}">
            <div class="order-card-header">
              <div>
                <div class="order-number">
                  Order #${escapeHTML(orderId)}
                </div>

                <div class="order-date">
                  ${formatDate(date)}
                </div>
              </div>

              <span class="order-status ${stage.css || status}">
                ${stage.label}
              </span>
            </div>

            <div class="order-products">
              ${productMarkup}
            </div>

            <div class="order-card-footer">
              <div>
                <span class="order-total-label">Order total</span>
                <strong class="order-total">
                  ${formatMoney(total)}
                </strong>
              </div>

              ${(!order.paid && status !== "cancelled")
                ? `<div class="order-btns">
                    <button type="button" class="order-action ghost" data-cancel="${escapeHTML(order.rawId)}">Cancel</button>
                    <button type="button" class="order-action" data-pay="${escapeHTML(order.rawId)}">Pay now</button>
                  </div>`
                : canConfirmReceipt(order)
                  ? `<div class="order-btns">
                      <button type="button" class="order-action ghost" data-details="${escapeHTML(order.rawId)}">Details</button>
                      <button type="button" class="order-action" data-received="${escapeHTML(order.rawId)}">I received it</button>
                    </div>`
                  : `<button type="button" class="order-action" data-details="${escapeHTML(order.rawId)}">Order details</button>`}
            </div>
          </article>
        `;
      }).join("");
    }

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        filterButtons.forEach(item => {
          const active = item === button;

          item.classList.toggle("active", active);
          item.setAttribute("aria-pressed", String(active));
        });

        renderOrders();
      });
    });


    /* ---------- order details sheet ---------- */
    const odBackdrop = document.createElement("div");
    odBackdrop.className = "od-backdrop";
    odBackdrop.innerHTML = '<div class="od-sheet" role="dialog" aria-modal="true" aria-label="Order details"></div>';
    document.body.appendChild(odBackdrop);
    const odSheet = odBackdrop.firstChild;
    let odOpen = false;
    let reportStatus = {};
    let hubAddress = "";
    const REPORT_WINDOW_MS = 3 * 24 * 3600 * 1000;
    function fmtDay(d) { return new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
    function reportNote(p) {
      const r = reportStatus[String(p.id)];
      if (!r) return "";
      const money = (n) => formatMoney(Number(n) || 0);
      const price = (Number(p.price) || 0) * (Number(p.quantity) || 1);
      const refund = price * (1 - (Number(r.return_fee_percent) || 0) / 100);
      if (r.status === "open") return "Problem reported. We are reviewing it.";
      if (r.status === "return_approved") {
        const fee = Number(r.return_fee_percent) || 0;
        return "Return approved. Send the item to our hub" + (hubAddress ? " (" + hubAddress + ")" : "") + (r.return_deadline ? " by " + fmtDay(r.return_deadline) : "") + ", then tap the button below. " +
          (fee > 0 ? "A " + fee + "% return fee applies, so your refund will be " + money(refund) + "." : "No return fee applies. Your refund will be " + money(refund) + ".");
      }
      if (r.status === "return_sent") return "Waiting for our hub to receive your return. Your refund will be " + money(refund) + ".";
      if (r.status === "refund_due") return "We received your return. Your refund of " + money(refund) + " is on its way.";
      if (r.status === "refunded") return "Refunded " + money(r.refund_amount || refund) + ".";
      if (r.status === "dismissed") return "Report reviewed. No return or refund was approved.";
      if (r.status === "expired") return "The return period ended, so no refund is due.";
      return "";
    }
    function canMarkReturned(p) {
      const r = reportStatus[String(p.id)];
      return !!r && r.status === "return_approved";
    }
    function canReport(order, p) {
      if (!order.paid || normaliseStatus(order.status) === "cancelled") return false;
      if (reportStatus[String(p.id)]) return false;
      if (!p.dispatched) return false;
      if (p.delivered && p.deliveredAt && Date.now() > new Date(p.deliveredAt).getTime() + REPORT_WINDOW_MS) return false;
      return true;
    }

    function showOrderDetails(order) {
      const stage = orderStage(order);
      const status = normaliseStatus(order.status);
      const cancelled = stage.key === "cancelled";
      const allShipped = order.products.length > 0 && order.products.every(p => p.shipped);
      const shipped = status === "shipped" || status === "delivered" || allShipped;
      const delivered = status === "delivered" || stage.key === "delivered";

      const when = value => {
        if (!value) return "";
        const d = new Date(value);
        return isNaN(d) ? "" : d.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
      };
      const onTheWay = order.products.some(p => p.dispatched);
      const dispatchedTimes = order.products.map(p => p.dispatchedAt).filter(Boolean).sort();
      const hubTimes = order.products.map(p => p.hubAt).filter(Boolean).sort();
      const atHubCount = order.products.filter(p => p.atHub).length;
      const sentCount = order.products.filter(p => p.shipped).length;
      const deliveredTimes = order.products.map(p => p.deliveredAt).filter(Boolean).sort();
      const events = [];
      if (delivered) events.push(["Delivered", "You confirmed that your order arrived", when(deliveredTimes[deliveredTimes.length - 1])]);
      if (onTheWay) events.push(["On its way to you", order.products.every(p => p.dispatched || p.delivered) ? "BODEGS has sent your order" : "BODEGS has sent part of your order", when(dispatchedTimes[dispatchedTimes.length - 1])]);
      if (atHubCount) events.push(["At our hub", atHubCount + " of " + order.products.length + " item(s) received and checked", when(hubTimes[hubTimes.length - 1])]);
      else if (sentCount) events.push(["Sellers are sending your items", sentCount + " of " + order.products.length + " item(s) sent to our hub", ""]);
      if (order.paid) events.push(["Payment confirmed", "We received your payment", ""]);
      if (cancelled) events.unshift(["Cancelled", "This order was cancelled", ""]);
      events.push(["Order placed", order.paid || cancelled ? "" : "Waiting for your payment", when(order.createdAt)]);

      const bannerText = cancelled ? "Cancelled"
        : delivered ? "Delivered"
        : onTheWay ? "On its way to you"
        : atHubCount ? "At our hub · getting your order ready"
        : order.paid ? "Paid · preparing your order"
        : "Awaiting payment";
      const bannerClass = cancelled ? "cancelled" : (order.paid ? "good" : "wait");

      const steps = `
        <div class="od-banner dk-skip ${bannerClass}">
          <span class="od-banner-dot"></span>${bannerText}
        </div>
        <div class="od-section od-updates">
          <h3>ORDER UPDATES</h3>
          ${events.map((e, i) => `
            <div class="od-event ${i === 0 ? "latest" : ""}">
              ${e[2] ? `<small>${escapeHTML(e[2])}</small>` : ""}
              <strong>${escapeHTML(e[0])}</strong>
              ${e[1] ? `<span>${escapeHTML(e[1])}</span>` : ""}
            </div>`).join("")}
        </div>`;

      const items = order.products.length ? order.products.map(p => {
        const extra = [p.size ? "Size " + p.size : "", p.color ? p.color : ""].filter(Boolean).join(" · ");
        const qty = Number(p.quantity) || 1;
        return `
          <div class="od-item">
            <img src="${escapeHTML(p.image || " ")}" alt="" onerror="this.style.visibility='hidden'">
            <div class="od-item-info">${escapeHTML(p.name || "Fashion item")}
              <small>${extra ? escapeHTML(extra) + " · " : ""}Qty ${qty}</small>
            </div>
            <strong>${formatMoney((Number(p.price) || 0) * qty)}</strong>
          </div>
          ${reportNote(p) ? `<p class="od-sub" style="margin:-4px 0 10px 66px">${escapeHTML(reportNote(p))}</p>` : ""}
          ${canMarkReturned(p) ? `<button type="button" class="od-report" data-returned="${escapeHTML(reportStatus[String(p.id)].id)}">I have sent it back</button>` : ""}
          ${canReport(order, p) ? `<button type="button" class="od-report" data-report="${escapeHTML(p.id)}" data-pname="${escapeHTML(p.name || "this item")}">Report a problem</button>` : ""}`;
      }).join("") : '<p class="od-sub">Order items unavailable</p>';

      const line = (a, b) => b ? `<div class="od-row"><span>${a}</span><span>${escapeHTML(b)}</span></div>` : "";

      odSheet.innerHTML = `
        <div class="od-grab"></div>
        <div class="od-head">
          <div>
            <h2>Order #${escapeHTML(order.id)}</h2>
            <div class="od-sub">${formatDate(order.createdAt)}</div>
          </div>
          <span class="order-status ${stage.css || stage.key}">${stage.label}</span>
        </div>
        ${steps}
        <div class="od-section"><h3>ITEMS</h3>${items}</div>
        <div class="od-section">
          <h3>DELIVERY</h3>
          ${line("Name", order.customer)}
          ${line("Phone", order.phone)}
          ${line("Address", order.address)}
          ${line("City", order.city)}
        </div>
        <div class="od-section">
          <h3>PAYMENT</h3>
          <div class="od-row"><span>Status</span><span>${order.paid ? "Paid" : (cancelled && order.refundAmount) ? "Paid, then refunded" : cancelled ? "Not paid" : "Awaiting payment"}</span></div>
          <div class="od-row"><span>Total</span><strong>${formatMoney(order.total)}</strong></div>
        </div>
        ${cancelled && order.refundAmount ? `
          <div class="od-section">
            <h3>REFUND</h3>
            <div class="od-row"><span>Cancellation fee (10%)</span><span>${formatMoney(order.cancelFee)}</span></div>
            <div class="od-row"><span>Refunded to you</span><strong>${formatMoney(order.refundAmount)}</strong></div>
          </div>` : ""}
        ${canConfirmReceipt(order) ? `<button type="button" class="od-close" data-received="${escapeHTML(order.rawId)}">I received it</button>` : ""}
        ${(!order.paid && !cancelled) ? `<button type="button" class="od-close" data-pay="${escapeHTML(order.rawId)}">Pay now</button>` : ""}
        ${(!cancelled && !shipped && !delivered) ? `<button type="button" class="od-cancel" data-cancel="${escapeHTML(order.rawId)}">Cancel order</button>` : ""}
        <button type="button" class="od-close" id="odClose" style="background:transparent;color:inherit;border:1px solid rgba(23,59,50,.25);margin-top:10px">Close</button>
      `;

      odSheet.scrollTop = 0;
      odBackdrop.classList.add("open");
      if (!odOpen) {
        odOpen = true;
        try { history.pushState({ order: 1 }, "", "#order"); } catch (e) {}
      }
    }

    function hideOrderDetails(fromPop) {
      if (!odOpen) return;
      odOpen = false;
      odBackdrop.classList.remove("open");
      if (!fromPop) { try { history.back(); } catch (e) {} }
    }

    odBackdrop.addEventListener("click", function (event) {
      if (event.target === odBackdrop || event.target.id === "odClose") hideOrderDetails(false);
    });
    window.addEventListener("popstate", function () { hideOrderDetails(true); });

    ordersList.addEventListener("click", function (event) {
      const button = event.target.closest("[data-details]");
      if (!button) return;
      const order = loadedOrders.find(o => String(o.rawId) === button.getAttribute("data-details"));
      if (order) showOrderDetails(order);
    });


    /* ---------- report a problem with an item ---------- */
    document.addEventListener("click", function (event) {
      const button = event.target.closest("[data-report]");
      if (!button) return;
      const itemId = button.getAttribute("data-report");
      const pname = button.getAttribute("data-pname") || "this item";
      const wrap = document.createElement("div");
      wrap.className = "od-confirm";
      wrap.innerHTML = `
        <div class="od-confirm-box dk-skip" role="alertdialog" aria-modal="true">
          <h3>Report a problem</h3>
          <p>${escapeHTML(pname)}. You can report within 3 days after delivery. If we approve, you send the item to our hub and a 15% return fee may apply to cover transport.</p>
          <select id="rpReason">
            <option value="">What is the problem?</option>
            <option>Wrong item</option>
            <option>Damaged</option>
            <option>Not as described</option>
            <option>Wrong size</option>
            <option>Other</option>
          </select>
          <textarea id="rpDetails" rows="3" maxlength="1000" placeholder="Tell us more (optional)"></textarea>
          <p id="rpMsg" style="color:#a8372f;margin:0"></p>
          <button type="button" class="od-yes">Send report</button>
          <button type="button" class="od-no">Cancel</button>
        </div>`;
      document.body.appendChild(wrap);
      const box = wrap.firstElementChild;
      box.style.background = getComputedStyle(odSheet).backgroundColor;
      const close = () => wrap.remove();
      box.querySelector(".od-no").addEventListener("click", close);
      const go = box.querySelector(".od-yes");
      go.addEventListener("click", async () => {
        const reason = box.querySelector("#rpReason").value;
        const msg = box.querySelector("#rpMsg");
        if (!reason) { msg.textContent = "Please choose what the problem is."; return; }
        go.disabled = true; go.textContent = "Sending...";
        const { data, error } = await sb.rpc("buyer_report_problem", {
          p_item_id: String(itemId), p_reason: reason, p_details: box.querySelector("#rpDetails").value
        });
        const texts = {
          not_sent_yet: "This item has not been sent to you yet.",
          window_closed: "The 3-day window for this item has closed.",
          already_reported: "You have already reported this item.",
          not_paid: "This order is not paid.",
          not_yours: "This is not your order."
        };
        if (error || data !== "ok") {
          msg.textContent = error ? "We could not send this. Please try again." : (texts[data] || "We could not send this. Please try again.");
          go.disabled = false; go.textContent = "Send report";
          return;
        }
        box.innerHTML = `
          <h3>Thank you</h3>
          <p>We received your report and will review it. We will update the item here once we have decided.</p>
          <button type="button" class="od-yes">OK</button>`;
        box.querySelector(".od-yes").addEventListener("click", () => { wrap.remove(); location.reload(); });
      });
    });

    /* ---------- "I have sent it back" ---------- */
    document.addEventListener("click", async function (event) {
      const button = event.target.closest("[data-returned]");
      if (!button) return;
      if (!confirm("Tap OK only after you have handed the item over or sent it to our hub.")) return;
      button.disabled = true;
      const { data, error } = await sb.rpc("buyer_mark_returned", { p_report_id: String(button.getAttribute("data-returned")) });
      if (error || data !== "ok") { alert("We could not update this. Please try again."); button.disabled = false; return; }
      location.reload();
    });

    /* ---------- confirm that an order arrived ---------- */
    document.addEventListener("click", function (event) {
      const button = event.target.closest("[data-received]");
      if (!button) return;
      const orderId = button.getAttribute("data-received");

      const wrap = document.createElement("div");
      wrap.className = "od-confirm";
      wrap.innerHTML = `
        <div class="od-confirm-box dk-skip" role="alertdialog" aria-modal="true">
          <h3>Did you receive your order?</h3>
          <p>Only confirm if the item(s) have reached you. Once you confirm, the seller is paid and this cannot be undone.</p>
          <button type="button" class="od-keep od-no">Not yet</button>
          <button type="button" class="od-do od-yes">Yes, I received it</button>
        </div>`;
      document.body.appendChild(wrap);
      const box = wrap.firstElementChild;
      const ref = getComputedStyle(odSheet);
      box.style.background = ref.backgroundColor;
      box.style.color = ref.color;

      wrap.querySelector(".od-keep").onclick = () => wrap.remove();
      wrap.addEventListener("click", e => { if (e.target === wrap) wrap.remove(); });
      wrap.querySelector(".od-yes").onclick = async function () {
        const go = this;
        go.disabled = true;
        go.textContent = "Confirming...";
        const { error } = await sb.rpc("buyer_confirm_delivery", { p_order_id: String(orderId) });
        wrap.remove();
        if (error) { alert("We could not confirm this. Please try again."); return; }
        if (odOpen) hideOrderDetails(false);
        if (loadMyOrdersAgain) loadMyOrdersAgain();
      };
    });

    /* ---------- cancel an order ---------- */
    function askCancel(order) {
      const total = Number(order.total) || 0;
      const fee = Math.round(total * 10) / 100;
      const refund = Math.round((total - fee) * 100) / 100;

      const wrap = document.createElement("div");
      wrap.className = "od-confirm";
      wrap.innerHTML = `
        <div class="od-confirm-box dk-skip" role="alertdialog" aria-modal="true">
          <h3>Cancel this order?</h3>
          ${order.paid
            ? `<div class="od-fee"><strong>10% cancellation fee: ${formatMoney(fee)}</strong><br>
                 This covers payment processing charges and discourages cancelling after paying.
                 You will be refunded <strong>${formatMoney(refund)}</strong> to your original payment method.
                 Refunds can take a few business days.</div>`
            : `<p>You have not paid for this order yet, so there is no charge.</p>`}
          <button type="button" class="od-keep">Keep my order</button>
          <button type="button" class="od-do">${order.paid ? "Cancel and accept 10% fee" : "Cancel order"}</button>
        </div>`;
      document.body.appendChild(wrap);

      const box = wrap.firstElementChild;
      box.style.background = getComputedStyle(odSheet).backgroundColor;
      box.style.color = getComputedStyle(odSheet).color;

      wrap.querySelector(".od-keep").onclick = () => wrap.remove();
      wrap.addEventListener("click", e => { if (e.target === wrap) wrap.remove(); });
      wrap.querySelector(".od-do").onclick = async function () {
        const go = this;
        go.disabled = true;
        go.textContent = "Cancelling...";
        let message = "";
        try {
          const res = await sb.functions.invoke("cancel-order", { body: { order_id: order.rawId } });
          if (res.error) {
            let detail = {};
            try { detail = await res.error.context.json(); } catch (e) {}
            if (detail.error === "no reference") message = "This order can't be cancelled online. Please contact BODEGS support.";
            else if (detail.error === "refund failed") message = "We couldn't process the refund, so your order was not cancelled. Please try again.";
            else if (detail.error === "cannot cancel") message = "This order can no longer be cancelled.";
            else message = "We couldn't cancel the order. Please try again.";
          } else if (!(res.data && res.data.cancelled)) {
            message = "We couldn't cancel the order. Please try again.";
          }
        } catch (e) { message = "We couldn't cancel the order. Please try again."; }

        wrap.remove();
        if (message) { alert(message); return; }
        hideOrderDetails(false);
        if (loadMyOrdersAgain) loadMyOrdersAgain();
      };
    }

    document.addEventListener("click", function (event) {
      const button = event.target.closest("[data-cancel]");
      if (!button) return;
      const order = loadedOrders.find(o => String(o.rawId) === button.getAttribute("data-cancel"));
      if (order) askCancel(order);
    });

    // Paystack TEST public key. Safe to show; the secret key never goes in this page.
    const PAYSTACK_PUBLIC_KEY = "pk_test_7931850570204e5adeff382152b45f7f0077cf8e";
    let loadMyOrdersAgain = null;

    document.addEventListener("click", async event => {
      const button = event.target.closest("[data-pay]");
      if (!button) return;

      const orderId = button.getAttribute("data-pay");
      button.disabled = true;
      button.textContent = "Opening...";

      try {
        const found = await sb.from("orders").select("total").eq("id", orderId).single();
        const session = await sb.auth.getSession();
        const email = session && session.data && session.data.session && session.data.session.user.email;
        if (found.error || !found.data || !email) throw new Error("lookup failed");

        const reference = "BDG-" + String(orderId).replace(/-/g, "").slice(0, 20) + "-" + Date.now();

        new PaystackPop().newTransaction({
          key: PAYSTACK_PUBLIC_KEY,
          email: email,
          amount: Math.round(Number(found.data.total) * 100),
          currency: "NGN",
          ref: reference,
          metadata: { order_id: orderId },
          onSuccess: async function () {
            try {
              await sb.functions.invoke("verify-payment", {
                body: { reference: reference, order_id: orderId }
              });
            } catch (e) { /* the list below shows the real state */ }
            hideOrderDetails(false);
            if (loadMyOrdersAgain) loadMyOrdersAgain();
          },
          onCancel: function () {
            button.disabled = false;
            button.textContent = "Pay now";
          }
        });
      } catch (e) {
        button.disabled = false;
        button.textContent = "Pay now";
        alert("We couldn't start the payment. Please try again.");
      }
    });

    async function loadMyOrders() {
      ordersList.innerHTML =
        '<div class="orders-message">Loading your orders...</div>';

      const user = await requireLogin();
      if (!user) return;

      const { data, error } = await sb
        .from("orders")
        .select(
          "id, status, payment_status, total, created_at, customer_name, phone, delivery_address, city, cancel_fee, refund_amount, " +
          "order_items(id, qty, price_at_purchase, product_name, product_image, size, color, shipped_at, delivered_at, hub_received_at, dispatched_at)"
        )
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

      if (error) {
        ordersList.innerHTML =
          '<div class="orders-message">We could not load your orders. ' +
          'Please check your connection and try again.</div>';
        return;
      }

      reportStatus = {};
      try {
        const rep = await sb.from("item_reports").select("id, item_id, status, return_fee_percent, return_deadline, refund_amount");
        if (!rep.error && rep.data) rep.data.forEach(r => { reportStatus[String(r.item_id)] = r; });
        if (rep.data && rep.data.some(r => r.status === "return_approved")) {
          const h = await sb.rpc("get_hub_address");
          if (!h.error && h.data) hubAddress = String(h.data);
        }
      } catch (e) {}

      loadedOrders = data.map(order => ({
        id: "BOD-" + String(order.id).slice(0, 8).toUpperCase(),
        rawId: order.id,
        paid: order.payment_status === "paid",
        createdAt: order.created_at,
        status: order.status,
        total: order.total,
        customer: order.customer_name,
        phone: order.phone,
        address: order.delivery_address,
        city: order.city,
        cancelFee: order.cancel_fee,
        refundAmount: order.refund_amount,
        products: (order.order_items || []).map(item => ({
          name: item.product_name,
          image: item.product_image,
          price: item.price_at_purchase,
          id: item.id,
          quantity: item.qty,
          size: item.size,
          color: item.color,
          shipped: !!item.shipped_at,
          shippedAt: item.shipped_at,
          atHub: !!item.hub_received_at,
          hubAt: item.hub_received_at,
          dispatched: !!item.dispatched_at,
          dispatchedAt: item.dispatched_at,
          delivered: !!item.delivered_at,
          deliveredAt: item.delivered_at
        }))
      }));

      renderOrders();
    }

    loadMyOrdersAgain = loadMyOrders;
    loadMyOrders();
  </script>

<script src="nav.js?v=7"></script>
