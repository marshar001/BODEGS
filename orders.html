
<!DOCTYPE html>
<html lang="en">

    name="description"
    content="View and track your BODEGS fashion orders."

  <style>
    .orders-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 110px;
      min-height: 100vh;
    }

    .orders-header {
      margin: 24px 0;
    }

    .orders-header .verified-badge {
      color: #111;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    .orders-header h1 {
      margin: 8px 0;
      color: var(--text);
      font-size: 30px;
    }

    .orders-header p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .orders-filters {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 4px 0 16px;
      margin-bottom: 8px;
    }

    .orders-filter {
      flex-shrink: 0;
      border: 1px solid var(--sage);
      border-radius: 22px;
      padding: 10px 17px;
      background: transparent;
      color: #111;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .orders-filter.active {
      background: var(--deep-green);
      border-color: var(--deep-green);
      color: var(--white);
    }

    .order-card {
      background: var(--cream-light);
      border: 1px solid rgba(23, 59, 50, 0.10);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding-bottom: 13px;
      border-bottom: 1px solid rgba(23, 59, 50, 0.12);
    }

    .order-number {
      color: var(--text);
      font-size: 13px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .order-date {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .order-status {
      display: inline-block;
      flex-shrink: 0;
      padding: 6px 10px;
      border-radius: 20px;
      background: var(--sage);
      color: #111;
      font-size: 11px;
      font-weight: bold;
    }

    .order-status.pending {
      background: #f5e5bd;
      color: #795516;
    }

    .order-pay-badge {
      display: block;
      margin-top: 6px;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
    }

    .order-pay-badge.paid {
      background: #d9ecdf;
      color: #1f5b34;
    }

    .order-pay-badge.unpaid {
      background: #f9d9d5;
      color: #8a2f27;
    }

    button.order-action {
      border: 0;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .order-status.paid {
      background: #d9ecdf;
      color: #1f5b34;
    }

    .order-status.cancelled {
      background: #f3d8d5;
      color: #873b32;
    }

    .order-products {
      padding: 14px 0;
    }

    .order-product {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .order-product:last-child {
      margin-bottom: 0;
    }

    .order-product img {
      width: 68px;
      height: 78px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 12px;
      background: var(--cream);
    }

    .order-product-info {
      flex: 1;
      min-width: 0;
    }

    .order-product-info h3 {
      color: var(--text);
      font-size: 14px;
      margin: 0 0 6px;
      overflow-wrap: anywhere;
    }

    .order-product-info p {
      color: var(--muted);
      font-size: 12px;
      margin: 0;
    }

    .order-product-price {
      color: #111;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .order-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 13px;
      border-top: 1px solid rgba(23, 59, 50, 0.12);
    }

    .order-total-label {
      color: var(--muted);
      font-size: 12px;
    }

    .order-total {
      display: block;
      margin-top: 5px;
      color: #111;
      font-size: 17px;
    }

    .order-action {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--deep-green);
      color: var(--white);
      text-decoration: none;
      font-size: 12px;
      text-align: center;
    }

    .orders-empty {
      padding: 35px 20px;
      margin-top: 12px;
      border-radius: 22px;
      background: var(--cream-light);
      text-align: center;
    }

    .orders-empty-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--sage);
      display: grid;
      place-items: center;
    }

    .orders-empty-icon svg {
      width: 27px;
      height: 27px;
      fill: none;
      stroke: var(--deep-green);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .orders-empty h2 {
      color: var(--text);
      font-size: 20px;
      margin-bottom: 8px;
    }

    .orders-empty p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .orders-empty a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 14px;
      background: var(--deep-green);
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
    }

    .orders-message {
      padding: 20px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 380px) {
      .orders-page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .order-card {
        padding: 12px;
      }

      .order-product img {
        width: 58px;
        height: 68px;
      }

      .order-product-price {
        font-size: 12px;
      }
    }

    /* ---- fixed top, compact cards ---- */
    .orders-top {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: 0 -16px;
      padding: 52px 16px 0; /* leaves room for the back arrow above the title */
    }

    .orders-top .orders-header {
      margin: 6px 0 4px;
    }

    .orders-top .orders-header h1 {
      margin: 4px 0 2px;
      font-size: 26px;
    }

    /* the fixed top stays slim so more orders fit on screen */
    .orders-top .orders-header p:last-child {
      display: none;
    }

    .orders-filters {
      scrollbar-width: none;
      padding-bottom: 12px;
      margin-bottom: 0;
    }

    .orders-filters::-webkit-scrollbar {
      display: none;
    }

    .order-card {
      padding: 12px 14px;
      margin-bottom: 10px;
      border-radius: 18px;
    }

    .order-card-header {
      padding-bottom: 9px;
      align-items: center;
    }

    .order-number {
      font-size: 13px;
    }

    .order-date {
      margin-top: 2px;
      font-size: 11px;
    }

    .order-status {
      padding: 5px 11px;
      font-size: 11px;
    }

    .order-products {
      padding: 10px 0 8px;
    }

    .order-product {
      gap: 10px;
      margin-bottom: 8px;
    }

    .order-product img {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .order-product-info h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .order-product-info p {
      margin: 2px 0 0;
      font-size: 12px;
    }

    .order-card-footer {
      padding-top: 9px;
    }

    .order-total-label {
      display: inline;
      font-size: 12px;
    }

    .order-total {
      display: inline;
      margin: 0 0 0 6px;
      font-size: 16px;
    }

    .order-action {
      padding: 8px 14px;
      font-size: 12px;
    }

    .order-card.is-cancelled {
      opacity: 0.6;
    }
  </style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
    const ordersList = document.getElementById("ordersList");
    // The fixed top keeps the page colour so cards scroll cleanly underneath it.
    (function () {
      const top = document.getElementById("ordersTop");
      function paint() {
        if (top) top.style.setProperty("background-color", getComputedStyle(document.body).backgroundColor, "important");
      }
      paint();
      window.addEventListener("load", function () { setTimeout(paint, 700); });
    })();

    const filterButtons = document.querySelectorAll(".orders-filter");

    let currentFilter = "all";

    // Orders are loaded from the BODEGS database (see the bottom of this script).
    let loadedOrders = [];

    function readOrders() {
      return loadedOrders;
    }

    function formatMoney(value) {
      const amount = Number(
        String(value ?? 0).replace(/[^\d.-]/g, "")
      );

      return "₦" + (
        Number.isFinite(amount) ? amount : 0
      ).toLocaleString("en-NG");
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function normaliseStatus(status) {
      const value = String(status || "pending")
        .toLowerCase()
        .trim();

      if (value === "confirmed" || value === "processing") {
        return "processing";
      }

      if (value === "shipped" || value === "in transit") {
        return "shipped";
      }

      if (value === "delivered" || value === "completed") {
        return "delivered";
      }

      if (value === "cancelled" || value === "canceled") {
        return "cancelled";
      }

      return "pending";
    }

    // One label per order: unpaid orders stay "pending"; once paid, a new order
    // reads "Paid" and moves on to processing/shipped/delivered as the seller updates it.
    function orderStage(order) {
      const base = normaliseStatus(order.status);
      if (base === "cancelled") return { key: "cancelled", label: "Cancelled" };
      if (!order.paid) return { key: "pending", label: "Pending" };
      if (base === "pending") return { key: "processing", label: "Paid", css: "paid" };
      return { key: base, label: base.charAt(0).toUpperCase() + base.slice(1) };
    }

    function formatDate(value) {
      if (!value) return "Date unavailable";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return escapeHTML(value);
      }

      return date.toLocaleDateString("en-NG", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function calculateOrderTotal(order) {
      if (order.total !== undefined) {
        return Number(
          String(order.total).replace(/[^\d.-]/g, "")
        ) || 0;
      }

      if (order.totalAmount !== undefined) {
        return Number(
          String(order.totalAmount).replace(/[^\d.-]/g, "")
        ) || 0;
      }

      const products = Array.isArray(order.products)
        ? order.products
        : Array.isArray(order.items)
          ? order.items
          : [];

      return products.reduce((sum, product) => {
        const price = Number(
          String(product.price ?? 0).replace(/[^\d.-]/g, "")
        ) || 0;

        const quantity = Number(product.quantity) || 1;

        return sum + price * quantity;
      }, 0);
    }

    function renderEmptyState() {
      ordersList.innerHTML = `
        <div class="orders-empty">
          <div class="orders-empty-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3.5h12A1.5 1.5 0 0 1 19.5 5v14A1.5 1.5 0 0 1 18 20.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"></path>
              <path d="M8 8h8M8 12h8M8 16h5"></path>
            </svg>
          </div>

          <h2>No orders yet</h2>

          <p>
            Your purchases will appear here once you place
            an order. Discover something you love.
          </p>

          <a href="explore.html">Start Shopping</a>
        </div>
      `;
    }

    function renderOrders() {
      const allOrders = readOrders();

      const filteredOrders = currentFilter === "all"
        ? allOrders
        : allOrders.filter(order =>
            orderStage(order).key === currentFilter
          );

      if (allOrders.length === 0) {
        renderEmptyState();
        return;
      }

      if (filteredOrders.length === 0) {
        ordersList.innerHTML = `
          <div class="orders-message">
            No ${escapeHTML(currentFilter)} orders to show.
          </div>
        `;
        return;
      }

      ordersList.innerHTML = filteredOrders.map((order, index) => {
        const products = Array.isArray(order.products)
          ? order.products
          : Array.isArray(order.items)
            ? order.items
            : [];

        const stage = orderStage(order);
        const status = stage.key;

        const orderId = order.id ||
          order.orderId ||
          `ORDER-${String(index + 1).padStart(4, "0")}`;

        const date = order.date ||
          order.createdAt ||
          order.created_at;

        const total = calculateOrderTotal(order);

        const productMarkup = products.length
          ? products.map(product => {
              const name = escapeHTML(product.name || "Fashion item");
              const image = escapeHTML(product.image || " ");
              const quantity = Number(product.quantity) || 1;
              const price = Number(
                String(product.price ?? 0).replace(/[^\d.-]/g, "")
              ) || 0;

              return `
                <div class="order-product">
                  <img
                    src="${image}"
                    alt="${name}"
                    loading="lazy"
                    onerror="this.style.visibility='hidden'"
                  >

                  <div class="order-product-info">
                    <h3>${name}</h3>
                    <p>Quantity: ${quantity}</p>
                  </div>

                  <span class="order-product-price">
                    ${formatMoney(price * quantity)}
                  </span>
                </div>
              `;
            }).join("")
          : `<p class="order-date">Order items unavailable</p>`;

        return `
          <article class="order-card${status === "cancelled" ? " is-cancelled" : ""}">
            <div class="order-card-header">
              <div>
                <div class="order-number">
                  Order #${escapeHTML(orderId)}
                </div>

                <div class="order-date">
                  ${formatDate(date)}
                </div>
              </div>

              <span class="order-status ${stage.css || status}">
                ${stage.label}
              </span>
            </div>

            <div class="order-products">
              ${productMarkup}
            </div>

            <div class="order-card-footer">
              <div>
                <span class="order-total-label">Order total</span>
                <strong class="order-total">
                  ${formatMoney(total)}
                </strong>
              </div>

              ${(!order.paid && status !== "cancelled")
                ? `<button type="button" class="order-action" data-pay="${escapeHTML(order.rawId)}">Pay now</button>`
                : `<a
                class="order-action"
                href="profile.html"
                aria-label="View account for order ${escapeHTML(orderId)}"
              >
                Order details
              </a>`}
            </div>
          </article>
        `;
      }).join("");
    }

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        filterButtons.forEach(item => {
          const active = item === button;

          item.classList.toggle("active", active);
          item.setAttribute("aria-pressed", String(active));
        });

        renderOrders();
      });
    });

    // Paystack TEST public key. Safe to show; the secret key never goes in this page.
    const PAYSTACK_PUBLIC_KEY = "pk_test_7931850570204e5adeff382152b45f7f0077cf8e";
    let loadMyOrdersAgain = null;

    ordersList.addEventListener("click", async event => {
      const button = event.target.closest("[data-pay]");
      if (!button) return;

      const orderId = button.getAttribute("data-pay");
      button.disabled = true;
      button.textContent = "Opening...";

      try {
        const found = await sb.from("orders").select("total").eq("id", orderId).single();
        const session = await sb.auth.getSession();
        const email = session && session.data && session.data.session && session.data.session.user.email;
        if (found.error || !found.data || !email) throw new Error("lookup failed");

        const reference = "BDG-" + String(orderId).replace(/-/g, "").slice(0, 20) + "-" + Date.now();

        new PaystackPop().newTransaction({
          key: PAYSTACK_PUBLIC_KEY,
          email: email,
          amount: Math.round(Number(found.data.total) * 100),
          currency: "NGN",
          ref: reference,
          metadata: { order_id: orderId },
          onSuccess: async function () {
            try {
              await sb.functions.invoke("verify-payment", {
                body: { reference: reference, order_id: orderId }
              });
            } catch (e) { /* the list below shows the real state */ }
            if (loadMyOrdersAgain) loadMyOrdersAgain();
          },
          onCancel: function () {
            button.disabled = false;
            button.textContent = "Pay now";
          }
        });
      } catch (e) {
        button.disabled = false;
        button.textContent = "Pay now";
        alert("We couldn't start the payment. Please try again.");
      }
    });

    async function loadMyOrders() {
      ordersList.innerHTML =
        '<div class="orders-message">Loading your orders...</div>';

      const user = await requireLogin();
      if (!user) return;

      const { data, error } = await sb
        .from("orders")
        .select(
          "id, status, payment_status, total, created_at, " +
          "order_items(qty, price_at_purchase, product_name, product_image)"
        )
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

      if (error) {
        ordersList.innerHTML =
          '<div class="orders-message">We could not load your orders. ' +
          'Please check your connection and try again.</div>';
        return;
      }

      loadedOrders = data.map(order => ({
        id: "BOD-" + String(order.id).slice(0, 8).toUpperCase(),
        rawId: order.id,
        paid: order.payment_status === "paid",
        createdAt: order.created_at,
        status: order.status,
        total: order.total,
        products: (order.order_items || []).map(item => ({
          name: item.product_name,
          image: item.product_image,
          price: item.price_at_purchase,
          quantity: item.qty
        }))
      }));

      renderOrders();
    }

    loadMyOrdersAgain = loadMyOrders;
    loadMyOrders();
  </script>

<script src="nav.js?v=7"></script>
</body>
