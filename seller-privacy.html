<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy &amp; Cookie Policy (Sellers) — BODEGS</title>
<style>
  :root { --brand:#173b32; --bg:#f5f0e7; --card:#faf7f1; --muted:#6f7f78; --line:rgba(23,59,50,.16); --pill:#173b32; --pillt:#fff; }
  :root[data-theme="dark"] { --brand:#e8efe9; --bg:#121513; --card:#1b201d; --muted:#9aa8a1; --line:rgba(255,255,255,.12); --pill:#2f6a58; --pillt:#fff; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--brand); font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
  .top { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px 10px; }
  .row { display:flex; align-items:center; gap:12px; max-width:720px; margin:0 auto; }
  .back { width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--brand); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .back svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .row b { font-family:Georgia,serif; font-size:20px; letter-spacing:.06em; }
  main { max-width:720px; margin:0 auto; padding:20px 18px 60px; }
  h1 { font-family:Georgia,serif; font-size:28px; line-height:1.15; margin:6px 0 4px; }
  .upd { color:var(--muted); font-size:13px; margin:0 0 18px; }
  h2 { font-size:16.5px; margin:26px 0 6px; }
  p, li { font-size:15px; line-height:1.65; margin:0 0 10px; }
  ul { padding-left:20px; margin:0 0 10px; }
  .note { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; font-size:14px; line-height:1.55; margin:0 0 14px; }
  table { width:100%; border-collapse:collapse; margin:8px 0 14px; font-size:13.5px; }
  th,td { text-align:left; vertical-align:top; padding:9px 8px; border-bottom:1px solid var(--line); line-height:1.45; }
  th { font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  td:first-child { font-weight:600; width:34%; }
  a { color:inherit; }
</style>
</head>
<body>
<div class="top">
  <div class="row">
    <button class="back" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <b>BODEGS</b>
  </div>
</div>
<main id="doc"></main>
<script>
(function () {
  var theme = "";
  try { theme = localStorage.getItem("bodegsTheme") || ""; } catch (e) {}
  if (theme === "dark" || (theme !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.setAttribute("data-theme", "dark");
  var UPDATED = "Last updated: 9 November 2026";
  var D = {"title": "Privacy & Cookie Policy (Sellers)", "body": [["p", "This policy explains what personal and business information BODEGS collects from sellers, why we collect it, who sees it, and your rights. It follows the Nigeria Data Protection Act 2023. BODEGS is the “data controller”. Contact: bodegs.ng@gmail.com or WhatsApp 08107771903. This policy applies together with the Buyer Privacy & Cookie Policy for the parts of your account that work like a buyer account."], ["h", "1. What we collect and what we use it for"], ["table", [["What we collect", "Why we need it"], ["Full name (as on your ID), phone / WhatsApp number, email, age", "To identify you, contact you about orders and your application, and confirm you are 18+."], ["Boutique name, category, description, city / state, Instagram or website (optional)", "To run and show your boutique and process your application."], ["Government ID, CAC registration number and certificate, proof of shop or warehouse address", "To verify that you are a real, registered seller and keep fake stores off BODEGS. These documents are kept private; only the BODEGS review team can open them."], ["Your seller password (stored scrambled; we cannot read it)", "To protect your seller account."], ["Bank name, account number and account name; the payout recipient code created by Paystack", "To pay you your earnings. Paystack checks that the account is real and holds the account name."], ["Product listings: photos, titles, descriptions, prices, sizes, stock", "To display and sell your items."], ["Orders, sales, commission and payout records", "To manage orders, pay you, calculate commission, and keep accounting and tax records."], ["Part of the buyer’s details for each order: buyer name, items ordered and a partly hidden phone number", "So you know who the order is for. You never see the buyer’s address."], ["Messages and photos you send to support", "To look into problems and disputes."], ["Saved on your phone (see section 5): sign-in session, seller session, theme choice", "To make the seller page work."], ["Technical data our hosts record automatically, such as IP address, device type and error logs", "To keep the service secure and prevent fraud."]]], ["p", "We use your information only for the reasons above. We do not sell it and do not use it for advertising."], ["h", "2. Our legal bases"], ["p", "We use your information because it is needed to run your seller account and pay you; because you gave consent (for example by ticking the box to accept these documents and uploading your documents for verification); because the law requires it (tax, accounting, anti-fraud and money-laundering rules, lawful requests); and because we have a legitimate interest in keeping BODEGS free from fraud and counterfeit goods. You can withdraw consent at any time (section 6), though we may then be unable to keep your seller account open."], ["h", "3. Who we share it with"], ["ul", ["Paystack, to verify your bank account and send your payouts.", "Supabase, which stores our database, your uploaded documents and photos, and our login system.", "GitHub and similar services, which host and deliver the website files.", "Buyers, who see your boutique name, product photos, descriptions and prices.", "BODEGS delivery partners, when they need your business name and contact to collect or return an item.", "Courts, the police, tax authorities, regulators or others, when the law requires it or to prevent fraud or harm.", "A buyer of the BODEGS business, if it is ever sold, under the same protections as this policy."]], ["p", "We do not show your ID, CAC documents, address proof or bank details to buyers or other sellers."], ["h", "4. How long we keep it"], ["ul", ["While your seller account is open: your boutique details, listings and payout details.", "After your account is closed: your verification documents and personal details are kept locked away for 1 year, for fraud checks, disputes and lawful requests, then deleted or anonymised.", "Financial records of sales, commission and payouts (never your full bank login details) are kept for up to 6 years, because tax and accounting rules require it.", "Records tied to an open dispute or legal request are kept as long as the law or the case requires."]], ["h", "5. Cookies and information saved on your phone"], ["p", "BODEGS has no advertising or tracking cookies. We save small items in your browser storage so the seller page works: your sign-in session, your seller-session marker and your Light or Dark choice. These stay on your device and you can clear them in your browser settings, after which you will need to sign in again. Paystack and Google may set their own cookies on their own screens."], ["h", "6. Your rights"], ["p", "Under the Nigeria Data Protection Act 2023 you may ask to see, correct or delete your personal information, limit or object to certain uses, receive a copy in a common format, and withdraw consent. We do not make decisions about you using only automated means that significantly affect you. Write to bodegs.ng@gmail.com and we will reply within 30 days. We may need to keep some records after a deletion request for the reasons in section 4. You can also complain to the Nigeria Data Protection Commission (ndpc.gov.ng)."], ["h", "7. Security and breaches"], ["p", "Verification documents are stored privately and opened only by authorised BODEGS staff. We use encrypted connections and access controls. No system is perfectly secure. If a breach is likely to put you at risk, we will tell you and the Nigeria Data Protection Commission within the time the law requires."], ["h", "8. Changes"], ["p", "We may update this policy; the date at the top shows the latest version. For important changes we will tell you in your seller page or by email."]]};
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  var h = '<h1>' + esc(D.title) + '</h1><p class="upd">' + UPDATED + '</p>';
  D.body.forEach(function (b) {
    if (b[0] === "h") h += '<h2>' + esc(b[1]) + '</h2>';
    else if (b[0] === "p") h += '<p>' + esc(b[1]) + '</p>';
    else if (b[0] === "ul") h += '<ul>' + b[1].map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>';
    else if (b[0] === "table") h += '<table><tr><th>' + esc(b[1][0][0]) + '</th><th>' + esc(b[1][0][1]) + '</th></tr>' + b[1].slice(1).map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join("") + '</table>';
  });
  document.getElementById("doc").innerHTML = h;
  document.getElementById("back").addEventListener("click", function () {
    if (history.length > 1 && document.referrer) history.back(); else location.href = "seller.html";
  });
})();
</script>
</body>
</html>
