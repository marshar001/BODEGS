<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms and Privacy — BODEGS</title>
<style>
  :root { --brand:#173b32; --bg:#f5f0e7; --card:#faf7f1; --muted:#6f7f78; --line:rgba(23,59,50,.16); --pill:#173b32; --pillt:#fff; }
  :root[data-theme="dark"] { --brand:#e8efe9; --bg:#121513; --card:#1b201d; --muted:#9aa8a1; --line:rgba(255,255,255,.12); --pill:#2f6a58; --pillt:#fff; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--brand); font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
  .top { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px 10px; }
  .row { display:flex; align-items:center; gap:12px; max-width:720px; margin:0 auto; }
  .back { width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--brand); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .back svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .row b { font-family:Georgia,serif; font-size:20px; letter-spacing:.06em; }
  .tabs { display:flex; gap:8px; max-width:720px; margin:12px auto 0; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; border:1px solid var(--line); background:var(--card); color:var(--brand); border-radius:999px; padding:9px 15px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .tab.on { background:var(--pill); color:var(--pillt); border-color:var(--pill); }
  main { max-width:720px; margin:0 auto; padding:20px 18px 60px; }
  h1 { font-family:Georgia,serif; font-size:28px; line-height:1.15; margin:6px 0 4px; }
  .upd { color:var(--muted); font-size:13px; margin:0 0 18px; }
  h2 { font-size:16.5px; margin:26px 0 6px; }
  p, li { font-size:15px; line-height:1.65; margin:0 0 10px; }
  ul { padding-left:20px; margin:0 0 10px; }
  .note { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; font-size:14px; line-height:1.55; margin:0 0 14px; }
  table { width:100%; border-collapse:collapse; margin:8px 0 14px; font-size:13.5px; }
  th,td { text-align:left; vertical-align:top; padding:9px 8px; border-bottom:1px solid var(--line); line-height:1.45; }
  th { font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  td:first-child { font-weight:600; width:34%; }
  a { color:inherit; }
</style>
</head>
<body>
<div class="top">
  <div class="row">
    <button class="back" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <b>BODEGS</b>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<main id="doc"></main>
<script>
(function () {
  var theme = "";
  try { theme = localStorage.getItem("bodegsTheme") || ""; } catch (e) {}
  if (theme === "dark" || (theme !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.setAttribute("data-theme", "dark");

  var UPDATED = "Last updated: 9 November 2026";
  var DOCS = {
    "terms": { tab: "Buyer Terms", title: "Terms & Conditions (Buyers)", body: [
      ["p","These terms are an agreement between you and BODEGS. By creating an account, signing in or placing an order, you confirm that you have read and accept them, together with our Buyer Privacy & Cookie Policy."],
      ["h","1. Who we are"],
      ["p","BODEGS is an online fashion marketplace based in Abuja, Nigeria. Independent sellers list items on BODEGS; BODEGS takes your payment, receives the item from the seller at the BODEGS central hub, inspects it, and arranges delivery to you. Contact: bodegs.ng@gmail.com or WhatsApp 08107771903."],
      ["h","2. Your account"],
      ["ul",["You must be 18 or older and give correct information.","Keep your password private. You are responsible for everything done through your account.","One person, one account. Do not use someone else’s account or let someone else use yours.","We may suspend or close an account that breaks these terms, is used for fraud, or puts other users at risk."]],
      ["h","3. How buying works"],
      ["ul",["Prices are in Nigerian naira (₦). The price and any delivery cost are shown at checkout before you pay.","Item photos and descriptions, including the condition (for example new or used), are written by sellers. We review and inspect items, but we cannot promise that every listing is perfect.","An order is confirmed only after your payment succeeds. If a listing was wrong, sold out or unavailable, we will cancel the order and refund you in full.","BODEGS may refuse or cancel an order we reasonably suspect is fraudulent or placed by mistake, and will refund any payment you made."]],
      ["h","4. Payment"],
      ["p","Payments are processed by Paystack. Your card or bank details are entered on Paystack’s secure screen; BODEGS never sees or stores your full card number, PIN or CVV. If your payment goes through but the page closes, the order is still confirmed automatically."],
      ["h","5. Cancelling an order"],
      ["ul",["Order not yet paid: you can cancel for free.","Order already paid and not yet shipped: you can cancel. BODEGS keeps 10% of the order total to cover payment-processing costs and the work already done, and refunds the other 90% to your original payment method through Paystack. This is shown to you before you confirm.","Order already marked shipped: it can no longer be cancelled. You may still report a problem (section 8).","Refunds usually take 5 to 10 working days to show in your account, depending on your bank."]],
      ["h","6. Delivery"],
      ["p","Items go from the seller to the BODEGS central hub, where they are inspected, and then to you. Delivery times shown are estimates and can be affected by the seller, the hub, weather, traffic and delivery partners. Please give a complete address and a phone number that can receive calls. If delivery fails because the address or phone number was wrong or unreachable, extra delivery costs may be charged to you."],
      ["h","7. Confirming that you received your order"],
      ["p","When your item arrives, tap “I received it” in My Orders. If you do not, the order is treated as received 7 days after it was marked shipped. Once an order is confirmed as received, BODEGS pays the seller."],
      ["h","8. Problems, returns and refunds"],
      ["ul",["If an item is not as described, is damaged, is the wrong item or is counterfeit, contact us within 48 hours of receiving it (and before or instead of tapping “I received it” if you can), with clear photos and your order number.","We will investigate with the seller. Depending on the facts, we will arrange a replacement, a repair, a return, or a full or partial refund.","Items that arrive as described are not returnable only because you changed your mind, unless the listing says so.","Nothing in these terms takes away rights you have under Nigerian consumer-protection law, including the Federal Competition and Consumer Protection Act 2018."]],
      ["h","9. What you must not do"],
      ["ul",["Use BODEGS for fraud, money laundering or any illegal purpose.","Pay with a card or bank account that is not yours or that you are not allowed to use.","Abuse, threaten or harass sellers, other buyers or BODEGS staff.","Post false reviews, misuse refunds or the “I received it” button, or try to get around BODEGS payments or delivery.","Interfere with, copy, scrape or attack the app, website or its security."]],
      ["h","10. Deleting your account"],
      ["p","You can delete your account in Settings. It is held for 30 days so you can restore it by signing in again; after that it is closed and your personal data is handled as described in the Privacy Policy. Open orders must be completed first."],
      ["h","11. Our responsibility"],
      ["p","We take reasonable care to run BODEGS properly, but it is provided “as is” and may sometimes be unavailable. To the extent the law allows, BODEGS is not responsible for losses that were not reasonably foreseeable, or for delays outside our control. Our total responsibility to you for any one order is limited to the amount you paid for that order. Nothing here limits responsibility that cannot be limited by law."],
      ["h","12. Changes, disputes and law"],
      ["p","We may update these terms. We will show the new date at the top, and for important changes we will tell you in the app or by email. Continuing to use BODEGS after a change means you accept it. If you have a complaint, write to bodegs.ng@gmail.com first and we will reply within 7 working days. These terms are governed by the laws of the Federal Republic of Nigeria, and disputes we cannot settle between us go to the courts of the Federal Capital Territory, Abuja."]
    ]},

    "privacy": { tab: "Buyer Privacy", title: "Privacy & Cookie Policy (Buyers)", body: [
      ["p","This policy explains what personal information BODEGS collects from you as a buyer or visitor, why we collect it, who sees it, and your rights. It follows the Nigeria Data Protection Act 2023. BODEGS is the “data controller” of your information. Contact for privacy questions: bodegs.ng@gmail.com or WhatsApp 08107771903."],
      ["h","1. What we collect and what we use it for"],
      ["table",[["What we collect","Why we need it"],
        ["Name, email address and password (the password is stored scrambled; we cannot read it)","To create your account, sign you in and contact you about your orders. Legal basis: it is needed to provide the service."],
        ["Your age (you must be 18+)","To confirm you are old enough to use BODEGS."],
        ["If you use Google sign-in: your Google name, email and profile photo","To sign you in without a password and fill in your profile. Legal basis: your consent."],
        ["Profile photo (optional)","To show on your profile. Only if you add one."],
        ["Delivery details: name, phone number, address, city and state","To deliver your order. These are given to the BODEGS hub and delivery partners. Sellers do not see your address, and they see only part of your phone number."],
        ["Order and payment records: items, amounts, order status, Paystack payment reference, refunds","To process your order, refunds and cancellations, pay the seller, and keep accounting and tax records. We do not hold your card number."],
        ["Messages and photos you send to support","To look into problems, returns and complaints."],
        ["Saved on your phone (see section 6): sign-in session, cart, saved addresses, Light/Dark choice, remembered email","To make the app work and remember your choices."],
        ["Technical data our hosts record automatically, such as IP address, device and browser type, and error logs","To keep the service secure, find faults and prevent fraud."]]],
      ["p","We use your information only for the reasons above. We do not sell your personal information, and we do not use it for advertising or to track you across other websites."],
      ["h","2. Our legal bases"],
      ["p","We use your information because (a) it is needed to carry out your orders and provide your account; (b) you gave consent, for example when you tick the box to accept these documents or choose Google sign-in; (c) the law requires it, for example tax and accounting records or a lawful request from the authorities; and (d) we have a legitimate interest in preventing fraud and keeping BODEGS safe. You can withdraw consent at any time (see section 7)."],
      ["h","3. Who we share it with"],
      ["ul",["Paystack, to take payments and make refunds.","Supabase, which stores our database, files and login system and sends account emails.","Google, if you choose Google sign-in.","GitHub and similar services, which host and deliver the website files.","The seller of your item, who sees your name, the items ordered and a partly hidden phone number, but not your address.","BODEGS delivery partners, who receive only what they need to deliver: your name, phone number and address.","Courts, the police, regulators or other authorities, when the law requires it or to protect people from harm.","A buyer of the BODEGS business, if it is ever sold, under the same protections as this policy."]],
      ["p","These providers only handle your information to do work for us and are expected to protect it."],
      ["h","4. Where your information is kept"],
      ["p","Our providers may keep data on servers outside Nigeria. When data is sent abroad, we use providers with proper security practices and take steps required by the Nigeria Data Protection Act 2023 to protect it."],
      ["h","5. How long we keep it"],
      ["ul",["While your account is open: your account and profile details.","After you delete your account: we hold it for 30 days so you can restore it. Then your login and profile are removed.","We then keep a limited record (name, contact details, delivery details and order history) for 1 year, locked away, to deal with fraud checks, payment disputes and lawful requests. After that it is deleted or anonymised.","Financial records of transactions (amounts, dates, references, refunds; never card numbers) are kept for up to 6 years because tax and accounting rules require it.","Records tied to an open dispute or a legal request are kept as long as the law or the case requires."]],
      ["h","6. Cookies and information saved on your phone"],
      ["p","BODEGS does not use advertising or tracking cookies and has no ad networks. We save a few small items in your browser storage so the app works: your sign-in session, your cart, saved delivery addresses, your Light or Dark choice, and your email if you tick “Remember me”. These stay on your device. You can clear them any time in your browser or phone settings, or in Manage Cookies in Settings; you may then need to sign in again. Third parties such as Paystack and Google may set their own cookies on their own screens, under their own policies."],
      ["h","7. Your rights"],
      ["p","Under the Nigeria Data Protection Act 2023 you may ask to: see the personal information we hold about you; correct it; delete it; limit or object to certain uses; receive a copy in a common format; and withdraw consent. You also have the right not to be subject to decisions made only by automated means that significantly affect you (we do not make such decisions). Write to bodegs.ng@gmail.com. We will reply within 30 days. We may need to keep some records after a deletion request for the reasons in section 5. If you are unhappy with how we handle your data, you can complain to the Nigeria Data Protection Commission (ndpc.gov.ng)."],
      ["h","8. Children"],
      ["p","BODEGS is for people aged 18 and over. We do not knowingly collect information from anyone under 18. If we find that we have, we will delete it."],
      ["h","9. Security and breaches"],
      ["p","We protect your information with encrypted connections, access controls and strict limits on who can see it. No system is perfectly secure. If a breach is likely to put you at risk, we will tell you and the Nigeria Data Protection Commission within the time the law requires."],
      ["h","10. Changes to this policy"],
      ["p","We may update this policy. The date at the top shows the latest version. For important changes we will tell you in the app or by email."]
    ]},

    "seller-terms": { tab: "Seller Terms", title: "Seller Terms & Conditions", body: [
      ["p","These terms are an agreement between you (the seller, your boutique or business) and BODEGS. By applying to sell, signing in to your seller account or listing an item, you confirm that you have read and accept them, together with the Seller Privacy Policy and the Buyer Terms where they concern orders."],
      ["h","1. Who can sell"],
      ["ul",["You must be 18 or older and legally able to run a business in Nigeria.","You must be a registered business, give your real name and boutique details, and provide a valid government ID, your CAC registration number and certificate, and proof of your shop or warehouse address.","Everything you submit must be true and your documents genuine. Fake or altered documents lead to permanent removal and may be reported to the authorities.","BODEGS may approve, refuse, pause or end any seller application or account, and may ask for more proof at any time."]],
      ["h","2. Your listings"],
      ["ul",["You may list only items you own and have the right to sell.","Photos and descriptions must be accurate and show the real item. State the condition honestly (new or used) and mention any flaws, size and measurements.","No counterfeit or fake-branded goods, stolen goods, or anything illegal. Items must be fashion items allowed on BODEGS; we may remove any listing we think is unsuitable.","Keep your stock up to date. If you cannot supply an ordered item, tell BODEGS immediately; repeated failures can lead to suspension.","You keep ownership of your photos and text, but you give BODEGS a free licence to show them in the app, website, and our promotion of the marketplace, for as long as the listing is live and a reasonable time after."]],
      ["h","3. How an order works"],
      ["ul",["When a buyer pays, you see the order in your seller page. Only paid orders appear.","Pack the item well and send it to the BODEGS central hub in Abuja. You do not deliver to the buyer and you will not see the buyer’s address; BODEGS handles delivery.","BODEGS inspects items at the hub. We may reject an item that is not as listed, is damaged, is counterfeit or is the wrong size or colour. In that case the buyer is refunded and no payment is made to you for that item. We may return the item to you, at your cost, or keep it for investigation if fraud is suspected.","Mark the order shipped only once the item has actually been sent. Once an order is marked delivered you cannot change it back."]],
      ["h","4. Commission and payouts"],
      ["ul",["BODEGS charges a commission of 10% of the price of each item sold. The commission rate shown in your seller page applies; we will tell you before any change takes effect, and a change never applies to orders already placed.","You are paid your sale price minus commission. BODEGS does not currently take any other fee from your payout. If this changes we will tell you first.","Payouts are made weekly (Mondays) for orders that the buyer has confirmed as received, or that were automatically confirmed 7 days after being marked shipped, and that were not cancelled or refunded.","Payouts go to the bank account you saved in Payments, by bank transfer through Paystack. The account name must match your boutique or your name as on your documents. You are responsible for entering the correct account number; we are not responsible for money sent to a wrong account you entered.","If a payout fails, the amount is included in a later payout once the problem is fixed.","If a buyer cancels after paying, you are not paid for that order and the item stays with you.","If a buyer is refunded after you were paid because the item was not as described or was counterfeit, BODEGS may deduct that amount from your future payouts or ask you to repay it."]],
      ["h","5. Your taxes and legal duties"],
      ["p","You are responsible for your own taxes (including VAT and income or company tax where they apply), business registration and licences, and for following Nigerian law on selling goods. BODEGS may report seller earnings to the tax authorities when the law requires."],
      ["h","6. Conduct"],
      ["ul",["Treat buyers and BODEGS staff with respect.","Do not contact buyers outside BODEGS to take orders or payments, or try to get around the BODEGS commission or delivery.","Do not manipulate reviews, prices or stock, open duplicate boutiques to avoid a suspension, or misuse your seller access.","Keep your seller password private. You are responsible for actions taken in your seller account."]],
      ["h","7. Suspension and closing your account"],
      ["p","BODEGS may remove listings, pause payouts during an investigation, suspend or close your account if you break these terms, receive repeated complaints or put buyers at risk. You may close your seller account at any time by writing to bodegs.ng@gmail.com. Orders already paid for must still be completed, and money you have earned and are owed will be paid out, less any amounts you owe BODEGS."],
      ["h","8. Our responsibility and yours"],
      ["p","BODEGS provides a marketplace and logistics service. We do not own the items you sell and are not the seller of them. To the extent the law allows, BODEGS is not responsible for lost profit or indirect loss, and our total responsibility to you for any order is limited to the amount payable to you for it. You agree to cover BODEGS’s losses and costs (including reasonable legal costs) arising from your false listings, counterfeit goods, breach of law or breach of these terms. Nothing here limits responsibility that cannot be limited by law."],
      ["h","9. Changes, disputes and law"],
      ["p","We may update these terms and will show the new date and tell you of important changes in your seller page or by email. Continuing to sell after a change means you accept it. Please raise any complaint with bodegs.ng@gmail.com first; we will reply within 7 working days. These terms are governed by the laws of the Federal Republic of Nigeria, and disputes we cannot settle go to the courts of the Federal Capital Territory, Abuja."]
    ]},

    "seller-privacy": { tab: "Seller Privacy", title: "Privacy & Cookie Policy (Sellers)", body: [
      ["p","This policy explains what personal and business information BODEGS collects from sellers, why we collect it, who sees it, and your rights. It follows the Nigeria Data Protection Act 2023. BODEGS is the “data controller”. Contact: bodegs.ng@gmail.com or WhatsApp 08107771903. This policy applies together with the Buyer Privacy & Cookie Policy for the parts of your account that work like a buyer account."],
      ["h","1. What we collect and what we use it for"],
      ["table",[["What we collect","Why we need it"],
        ["Full name (as on your ID), phone / WhatsApp number, email, age","To identify you, contact you about orders and your application, and confirm you are 18+."],
        ["Boutique name, category, description, city / state, Instagram or website (optional)","To run and show your boutique and process your application."],
        ["Government ID, CAC registration number and certificate, proof of shop or warehouse address","To verify that you are a real, registered seller and keep fake stores off BODEGS. These documents are kept private; only the BODEGS review team can open them."],
        ["Your seller password (stored scrambled; we cannot read it)","To protect your seller account."],
        ["Bank name, account number and account name; the payout recipient code created by Paystack","To pay you your earnings. Paystack checks that the account is real and holds the account name."],
        ["Product listings: photos, titles, descriptions, prices, sizes, stock","To display and sell your items."],
        ["Orders, sales, commission and payout records","To manage orders, pay you, calculate commission, and keep accounting and tax records."],
        ["Part of the buyer’s details for each order: buyer name, items ordered and a partly hidden phone number","So you know who the order is for. You never see the buyer’s address."],
        ["Messages and photos you send to support","To look into problems and disputes."],
        ["Saved on your phone (see section 5): sign-in session, seller session, theme choice","To make the seller page work."],
        ["Technical data our hosts record automatically, such as IP address, device type and error logs","To keep the service secure and prevent fraud."]]],
      ["p","We use your information only for the reasons above. We do not sell it and do not use it for advertising."],
      ["h","2. Our legal bases"],
      ["p","We use your information because it is needed to run your seller account and pay you; because you gave consent (for example by ticking the box to accept these documents and uploading your documents for verification); because the law requires it (tax, accounting, anti-fraud and money-laundering rules, lawful requests); and because we have a legitimate interest in keeping BODEGS free from fraud and counterfeit goods. You can withdraw consent at any time (section 6), though we may then be unable to keep your seller account open."],
      ["h","3. Who we share it with"],
      ["ul",["Paystack, to verify your bank account and send your payouts.","Supabase, which stores our database, your uploaded documents and photos, and our login system.","GitHub and similar services, which host and deliver the website files.","Buyers, who see your boutique name, product photos, descriptions and prices.","BODEGS delivery partners, when they need your business name and contact to collect or return an item.","Courts, the police, tax authorities, regulators or others, when the law requires it or to prevent fraud or harm.","A buyer of the BODEGS business, if it is ever sold, under the same protections as this policy."]],
      ["p","We do not show your ID, CAC documents, address proof or bank details to buyers or other sellers."],
      ["h","4. How long we keep it"],
      ["ul",["While your seller account is open: your boutique details, listings and payout details.","After your account is closed: your verification documents and personal details are kept locked away for 1 year, for fraud checks, disputes and lawful requests, then deleted or anonymised.","Financial records of sales, commission and payouts (never your full bank login details) are kept for up to 6 years, because tax and accounting rules require it.","Records tied to an open dispute or legal request are kept as long as the law or the case requires."]],
      ["h","5. Cookies and information saved on your phone"],
      ["p","BODEGS has no advertising or tracking cookies. We save small items in your browser storage so the seller page works: your sign-in session, your seller-session marker and your Light or Dark choice. These stay on your device and you can clear them in your browser settings, after which you will need to sign in again. Paystack and Google may set their own cookies on their own screens."],
      ["h","6. Your rights"],
      ["p","Under the Nigeria Data Protection Act 2023 you may ask to see, correct or delete your personal information, limit or object to certain uses, receive a copy in a common format, and withdraw consent. We do not make decisions about you using only automated means that significantly affect you. Write to bodegs.ng@gmail.com and we will reply within 30 days. We may need to keep some records after a deletion request for the reasons in section 4. You can also complain to the Nigeria Data Protection Commission (ndpc.gov.ng)."],
      ["h","7. Security and breaches"],
      ["p","Verification documents are stored privately and opened only by authorised BODEGS staff. We use encrypted connections and access controls. No system is perfectly secure. If a breach is likely to put you at risk, we will tell you and the Nigeria Data Protection Commission within the time the law requires."],
      ["h","8. Changes"],
      ["p","We may update this policy; the date at the top shows the latest version. For important changes we will tell you in your seller page or by email."]
    ]}
  };
  var ORDER = ["terms","privacy","seller-terms","seller-privacy"];

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function render(key) {
    var d = DOCS[key] || DOCS.terms; key = DOCS[key] ? key : "terms";
    var h = '<h1>' + esc(d.title) + '</h1><p class="upd">' + UPDATED + '</p>';
    d.body.forEach(function (b) {
      if (b[0] === "h") h += '<h2>' + esc(b[1]) + '</h2>';
      else if (b[0] === "p") h += '<p>' + esc(b[1]) + '</p>';
      else if (b[0] === "ul") h += '<ul>' + b[1].map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>';
      else if (b[0] === "table") {
        h += '<table><tr><th>' + esc(b[1][0][0]) + '</th><th>' + esc(b[1][0][1]) + '</th></tr>' +
          b[1].slice(1).map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join("") + '</table>';
      }
    });
    document.getElementById("doc").innerHTML = h;
    document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("on", t.dataset.k === key); });
    window.scrollTo(0, 0);
  }
  var tabs = document.getElementById("tabs");
  ORDER.forEach(function (k) {
    var b = document.createElement("button");
    b.className = "tab"; b.dataset.k = k; b.textContent = DOCS[k].tab;
    b.addEventListener("click", function () { history.replaceState(null, "", "#" + k); render(k); });
    tabs.appendChild(b);
  });
  document.getElementById("back").addEventListener("click", function () {
    if (history.length > 1 && document.referrer) history.back(); else location.href = "index.html";
  });
  window.addEventListener("hashchange", function () { render(location.hash.slice(1)); });
  render(location.hash.slice(1));
  var on = tabs.querySelector(".on"); if (on && on.scrollIntoView) on.scrollIntoView({ inline: "center", block: "nearest" });
})();
</script>
</body>
</html>
