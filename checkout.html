<!DOCTYPE html>
<html lang="en">
<head>
  <script src="cartkey.js?v=1"></script>
  <script src="dark.js?v=3"></script>
  <script src="press.js?v=1" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout — BODEGS</title>

  <meta
    name="description"
    content="Complete your BODEGS order."
  >

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css?v=20261031">
  <script src="theme.js?v=20261031" defer></script>
  <style>
    .dl-card { border:1px solid rgba(23,59,50,.2); border-radius:14px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; justify-content:space-between; }
    .dl-card .dl-tag { font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; opacity:.65; margin:0 0 6px; }
    .dl-card .dl-who { font-weight:600; margin:0 0 4px; font-size:15px; }
    .dl-card .dl-line { margin:0; font-size:14px; line-height:1.45; opacity:.85; }
    .dl-change { border:0; background:none; color:#173b32; font:inherit; font-weight:700; font-size:14px; text-decoration:underline; cursor:pointer; padding:2px 0; flex:none; }
    [data-theme="dark"] .dl-change { color:#9fd4bf; }
    .dl-empty { width:100%; border:1.5px dashed rgba(23,59,50,.4); border-radius:14px; padding:16px; background:transparent; color:inherit; font:inherit; font-weight:600; cursor:pointer; text-align:center; }
    .terms-box { display:flex !important; flex-direction:row !important; align-items:flex-start; gap:12px; border:1px solid rgba(23,59,50,.25); border-radius:12px; padding:14px 16px; margin:0 0 14px; font-size:14px; line-height:1.45; }
    .terms-box input { width:20px !important; height:20px; flex:none; margin:1px 0 0; padding:0; accent-color:#173b32; }
    .terms-box a { color:inherit; font-weight:700; text-decoration:underline; }
    #placeDemoOrder { display:block; width:100%; box-sizing:border-box; border:0; border-radius:14px; padding:16px; font:inherit; font-size:16px; font-weight:700; cursor:pointer; background:#173b32 !important; color:#fff !important; }
    #placeDemoOrder:disabled { background:#d3d3d0 !important; color:#8c8c88 !important; cursor:not-allowed; opacity:1; }
    [data-theme="dark"] #placeDemoOrder { background:#2f6a58 !important; color:#fff !important; }
    [data-theme="dark"] #placeDemoOrder:disabled { background:#3a3a3a !important; color:#8a8a8a !important; }
    #payHint { font-size:13px; text-align:center; opacity:.7; margin:8px 0 0; min-height:1em; }
    .ps-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; }
    .ps-backdrop[hidden] { display:none; }
    .ps-card { background:#fff; color:#1b1b1b; width:100%; max-width:380px; border-radius:22px; padding:26px 22px 20px; text-align:center; box-sizing:border-box; }
    .ps-icon { width:64px; height:64px; border-radius:50%; background:#dcebe3; color:#173b32; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
    .ps-icon svg { width:32px; height:32px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    .ps-card h3 { margin:0 0 6px; font-size:21px; }
    .ps-card p { margin:0 0 4px; font-size:14.5px; line-height:1.5; color:#5d6a64; }
    .ps-card .ps-total { font-size:26px; font-weight:800; color:#173b32; margin:10px 0 14px; }
    .ps-view, .ps-more { display:block; width:100%; border-radius:999px; padding:14px; font:inherit; font-size:15.5px; font-weight:700; cursor:pointer; box-sizing:border-box; }
    .ps-view { background:#173b32; color:#fff; border:0; margin-bottom:10px; }
    .ps-more { background:transparent; color:#173b32; border:1.5px solid rgba(23,59,50,.35); }
    [data-theme="dark"] .ps-card { background:#1d1d1d; color:#f0f0f0; }
    [data-theme="dark"] .ps-card p { color:#a8b3ad; }
    [data-theme="dark"] .ps-icon { background:#24473c; color:#bfe6d4; }
    [data-theme="dark"] .ps-card .ps-total { color:#bfe6d4; }
    [data-theme="dark"] .ps-view { background:#2f6a58 !important; color:#fff !important; }
    [data-theme="dark"] .ps-more { color:#bfe6d4 !important; border-color:rgba(255,255,255,.25) !important; }
    .ad-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:900; display:flex; align-items:flex-end; justify-content:center; }
    .ad-backdrop[hidden] { display:none; }
    .ad-sheet { background:#fff; color:#1b1b1b; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:18px 18px 24px; box-sizing:border-box; }
    [data-theme="dark"] .ad-sheet { background:#1d1d1d; color:#f0f0f0; }
    .ad-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px; }
    .ad-head h3 { margin:0; font-size:17px; line-height:1.3; }
    .ad-x { border:0; background:none; font-size:26px; line-height:1; cursor:pointer; color:inherit; padding:0 4px; }
    .ad-item { border:1px solid rgba(23,59,50,.2); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
    .ad-item.sel { border-color:#173b32; box-shadow:0 0 0 1px #173b32; }
    .ad-item b { display:block; margin-bottom:3px; }
    .ad-item p { margin:0 0 8px; font-size:14px; opacity:.85; line-height:1.4; }
    .ad-item button { border:1px solid #173b32; background:transparent; color:inherit; border-radius:18px; padding:7px 18px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
    .ad-item.sel button { background:#173b32; color:#fff; }
    .ad-add { width:100%; border:0; border-radius:12px; padding:14px; background:#173b32; color:#fff; font:inherit; font-weight:700; cursor:pointer; margin-top:4px; }
    .ad-form label { display:block; margin-bottom:12px; font-size:14px; }
    .ad-form input, .ad-form select { display:block; width:100%; box-sizing:border-box; margin-top:5px; padding:12px; border:1px solid rgba(0,0,0,.25); border-radius:10px; font:inherit; background:transparent; color:inherit; }
    .ad-form .ad-err { color:#a3392f; font-size:13px; min-height:1em; margin:0 0 8px; }
    .ad-form .row2 { display:flex; gap:10px; } .ad-form .row2 label { flex:1; }
    .ad-back { border:0; background:none; color:inherit; font:inherit; font-size:14px; text-decoration:underline; cursor:pointer; padding:0; margin-bottom:10px; }
  </style>
</head>

<body>

  <main class="checkout-page" style="padding-top:28px">

    


    <header class="checkout-header">
      <h1>Checkout</h1>
      <p>Confirm your delivery address to continue.</p>
    </header>

    <section class="checkout-section">
      <h2>Delivery</h2>
      <div id="deliveryCard"></div>
      <input type="hidden" id="checkoutName">
      <input type="hidden" id="checkoutPhone">
      <input type="hidden" id="checkoutAddress">
      <input type="hidden" id="checkoutCity">
    </section>

    <section class="checkout-section">
      <div class="checkout-summary-header">
        <div>
          <h2>Order Summary</h2>
          <p id="checkoutItemCount"></p>
        </div>
      </div>

      <div id="checkoutItems"></div>

      <div class="checkout-summary-lines">

        <div class="checkout-summary-row">
          <span>Subtotal</span>
          <strong id="checkoutSubtotal">₦0</strong>
        </div>

        <div class="checkout-summary-row">
          <span>Delivery</span>
          <strong>Calculated at payment</strong>
        </div>

      </div>

      <div class="checkout-total">
        <span>Total</span>
        <strong id="checkoutTotal">₦0</strong>
      </div>
    </section>

    <label class="terms-box">
      <input type="checkbox" id="acceptTerms">
      <span>I accept BODEGS's <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions ↗</a> and all policies linked within them.</span>
    </label>

    <button
      type="button"
      disabled
      class="checkout-place-order dk-skip"
      id="placeDemoOrder"
    >
      Pay now
    </button>

    <p id="payHint"></p>
    <p id="checkoutMessage" role="status" aria-live="polite"></p>

    <div class="ps-backdrop" id="psBackdrop" hidden>
      <div class="ps-card" role="dialog" aria-modal="true" aria-labelledby="psTitle">
        <div class="ps-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h3 id="psTitle">Payment successful</h3>
        <p id="psText"></p>
        <div class="ps-total" id="psTotal"></div>
        <button type="button" class="ps-view dk-skip" id="psView">View my order</button>
        <button type="button" class="ps-more dk-skip" id="psMore">Continue shopping</button>
      </div>
    </div>
    <div class="ad-backdrop" id="adBackdrop" hidden><div class="ad-sheet" id="adSheet"></div></div>

  </main>

<script src="https://js.paystack.co/v2/inline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    // Must be signed in (real BODEGS login). Fill in the delivery details we already know,
    // so a returning customer does not type them again.
    let addrWho = "guest";
    let addrList = [];      // saved addresses
    let chosen = null;      // {name, phone, address, city, state}
    let userMeta = {};
    const STATES = ["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT Abuja","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];

    function readList(key) {
      try { const v = JSON.parse(localStorage.getItem(key) || "[]"); return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    }

    function saveList() {
      try { localStorage.setItem("weraeAddresses:" + addrWho, JSON.stringify(addrList)); } catch (e) {}
      try { sb.auth.updateUser({ data: { bodegs_addresses: addrList } }); } catch (e) {}
    }

    function pickAddress(a) {
      chosen = {
        name: a.name || userMeta.full_name || "",
        phone: a.phone || "",
        address: a.line || a.address || "",
        city: a.city || "",
        state: a.state || ""
      };
      try { localStorage.setItem("weraeDelivery:" + addrWho, JSON.stringify(Object.assign({ id: a.id }, chosen))); } catch (e) {}
      document.getElementById("checkoutName").value = chosen.name;
      document.getElementById("checkoutPhone").value = chosen.phone;
      document.getElementById("checkoutAddress").value = chosen.address;
      document.getElementById("checkoutCity").value = chosen.state ? chosen.city + ", " + chosen.state : chosen.city;
      drawCard();
      updatePayState();
    }

    function addressComplete() {
      return !!(chosen && chosen.name && chosen.phone && chosen.address && chosen.city);
    }

    function drawCard() {
      const card = document.getElementById("deliveryCard");
      if (!addressComplete()) {
        card.innerHTML = '<button type="button" class="dl-empty" id="dlAdd">+ Add delivery address</button>';
        document.getElementById("dlAdd").addEventListener("click", function () { openSheet(addrList.length ? "list" : "form"); });
        return;
      }
      const place = [chosen.city, chosen.state].filter(Boolean).join(", ");
      card.innerHTML = '<div class="dl-card"><div><p class="dl-tag">Home delivery</p>' +
        '<p class="dl-who">' + escapeHTML(chosen.name) + ' · ' + escapeHTML(chosen.phone) + '</p>' +
        '<p class="dl-line">' + escapeHTML(chosen.address) + '<br>' + escapeHTML(place) + '</p></div>' +
        '<button type="button" class="dl-change" id="dlChange">Change</button></div>';
      document.getElementById("dlChange").addEventListener("click", function () { openSheet("list"); });
    }

    function closeSheet() { document.getElementById("adBackdrop").hidden = true; document.body.style.overflow = ""; }

    function openSheet(view) {
      const back = document.getElementById("adBackdrop");
      const sheet = document.getElementById("adSheet");
      back.hidden = false;
      document.body.style.overflow = "hidden";
      if (view === "form") drawForm(sheet); else drawList(sheet);
    }

    function drawList(sheet) {
      sheet.innerHTML = '<div class="ad-head"><h3>Please select or enter a new delivery address</h3><button class="ad-x" type="button" aria-label="Close">×</button></div><div id="adItems"></div><button type="button" class="ad-add" id="adNew">Add new address</button>';
      sheet.querySelector(".ad-x").addEventListener("click", closeSheet);
      const holder = sheet.querySelector("#adItems");
      addrList.forEach(function (a, i) {
        const on = chosen && (a.line || "") === chosen.address && (a.city || "") === chosen.city;
        const d = document.createElement("div");
        d.className = "ad-item" + (on ? " sel" : "");
        d.innerHTML = '<b>' + escapeHTML(a.label || "Address " + (i + 1)) + '</b><p>' +
          escapeHTML([a.name, a.phone].filter(Boolean).join(" · ")) + (a.name || a.phone ? '<br>' : '') +
          escapeHTML(a.line || "") + '<br>' + escapeHTML([a.city, a.state].filter(Boolean).join(", ")) + '</p>' +
          '<button type="button">' + (on ? "Selected" : "Select") + '</button>';
        d.querySelector("button").addEventListener("click", function () {
          pickAddress(a);
          closeSheet();
        });
        holder.appendChild(d);
      });
      sheet.querySelector("#adNew").addEventListener("click", function () { drawForm(sheet); });
      sheet.addEventListener("click", function (e) { e.stopPropagation(); });
    }

    function drawForm(sheet) {
      const opts = STATES.map(s => '<option value="' + s + '">' + s + '</option>').join("");
      sheet.innerHTML = (addrList.length ? '<button type="button" class="ad-back" id="adBack">← Back to saved addresses</button>' : '') +
        '<div class="ad-head"><h3>Add new address</h3><button class="ad-x" type="button" aria-label="Close">×</button></div>' +
        '<div class="ad-form">' +
        '<label>Full name<input id="fName" type="text" placeholder="Full name" autocomplete="name"></label>' +
        '<label>Phone number<input id="fPhone" type="tel" placeholder="Phone number" autocomplete="tel"></label>' +
        '<label>House number, street name<input id="fLine" type="text" placeholder="House number, street name, landmark"></label>' +
        '<div class="row2"><label>City / Area<input id="fCity" type="text" placeholder="City or area"></label>' +
        '<label>State<select id="fState"><option value="">Select state</option>' + opts + '</select></label></div>' +
        '<label>Label (optional)<input id="fLabel" type="text" placeholder="Home, Office..."></label>' +
        '<p class="ad-err" id="fErr"></p>' +
        '<button type="button" class="ad-add" id="fSave">Save and use this address</button></div>';
      sheet.querySelector(".ad-x").addEventListener("click", closeSheet);
      const bk = sheet.querySelector("#adBack");
      if (bk) bk.addEventListener("click", function () { drawList(sheet); });
      const prefName = (chosen && chosen.name) || userMeta.full_name || "";
      sheet.querySelector("#fName").value = prefName;
      if (chosen && chosen.phone) sheet.querySelector("#fPhone").value = chosen.phone;
      sheet.querySelector("#fSave").addEventListener("click", function () {
        const v = id => sheet.querySelector(id).value.trim();
        const a = { name: v("#fName"), phone: v("#fPhone"), line: v("#fLine"), city: v("#fCity"), state: v("#fState"), label: v("#fLabel") };
        const err = sheet.querySelector("#fErr");
        if (!a.name || !a.phone || !a.line || !a.city || !a.state) { err.textContent = "Please fill in every field except the label."; return; }
        if (a.phone.replace(/\D/g, "").length < 10) { err.textContent = "Please enter a valid phone number."; return; }
        a.id = String(Date.now());
        a.label = a.label || (addrList.length ? "Address " + (addrList.length + 1) : "Home");
        addrList.push(a);
        saveList();
        pickAddress(a);
        closeSheet();
      });
    }

    document.getElementById("adBackdrop").addEventListener("click", function (e) {
      if (e.target === this) closeSheet();
    });

    requireLogin().then(function (user) {
      if (!user) return;
      userMeta = user.user_metadata || {};
      addrWho = String(user.email || "guest").toLowerCase();

      addrList = readList("weraeAddresses:" + addrWho);
      if (!addrList.length && Array.isArray(userMeta.bodegs_addresses)) addrList = userMeta.bodegs_addresses;

      let last = null;
      try { last = JSON.parse(localStorage.getItem("weraeDelivery:" + addrWho) || "null"); } catch (e) {}
      last = last || userMeta.bodegs_delivery || null;

      // Older saved addresses had no name or phone: borrow them from the last delivery.
      addrList.forEach(function (a) {
        if (last) { if (!a.name) a.name = last.name || ""; if (!a.phone) a.phone = last.phone || ""; }
      });

      let start = null;
      if (last && (last.address || last.line)) start = { id: last.id, name: last.name, phone: last.phone, line: last.address || last.line, city: last.city, state: last.state };
      else if (addrList.length) start = addrList[0];
      if (start) pickAddress(start); else { drawCard(); updatePayState(); }
    });

    // Remember this delivery on the account (other phones) once an order is placed.
    function rememberDelivery(d) {
      try { sb.auth.updateUser({ data: { bodegs_delivery: d } }); } catch (e) {}
    }

    const checkoutItems =
      document.getElementById("checkoutItems");
    const checkoutItemCount =
      document.getElementById("checkoutItemCount");
    const checkoutSubtotal =
      document.getElementById("checkoutSubtotal");

    const checkoutTotal =
      document.getElementById("checkoutTotal");

    const cartProducts = JSON.parse(
      localStorage.getItem("weraeCart") || "[]"
    );

    if (cartProducts.length === 0) {

      checkoutItemCount.textContent = "0 items";

      checkoutItems.innerHTML = `
        <div class="checkout-empty">
          <p>Your cart is empty.</p>

          <a href="index.html" class="continue-shopping">
            Start Shopping
          </a>
        </div>
      `;

      checkoutSubtotal.textContent = "₦0";
      checkoutTotal.textContent = "₦0";

    } else {

      const totalQuantity = cartProducts.reduce(
        (total, product) => {
          return total + (product.quantity || 1);
        },
        0
      );

      checkoutItemCount.textContent =
        `${totalQuantity} ${totalQuantity === 1 ? "item" : "items"}`;

      let cartTotal = 0;

      cartProducts.forEach(product => {

        const numericPrice = Number(
  product.numericPrice ??
  String(product.price ?? 0).replace(/[^\d.]/g, "")
) || 0;

        const quantity = product.quantity || 1;

        const itemTotal =
          numericPrice * quantity;

        cartTotal += itemTotal;

        const item = document.createElement("article");

        item.className = "checkout-item";

        item.innerHTML = `
          <div class="checkout-item-image">
            <img
              src="${escapeHTML(product.image)}"
              alt="${escapeHTML(product.name)}"
            >
          </div>

          <div class="checkout-item-details">

            <h3>${escapeHTML(product.name)}</h3>

            <p class="checkout-item-seller">
              ${escapeHTML(product.sellerName || "BODEGS seller")}
            </p>

            ${(product.size || product.color) ? `<p class="checkout-item-quantity">${[product.color ? "Color: " + escapeHTML(product.color) : "", product.size ? "Size: " + escapeHTML(product.size) : ""].filter(Boolean).join(" · ")}</p>` : ""}

            <p class="checkout-item-quantity">
              Quantity: ${quantity}
            </p>

          </div>

          <div class="checkout-item-price">
            <strong>
              ₦${itemTotal.toLocaleString("en-NG")}
            </strong>
          </div>
        `;

        checkoutItems.appendChild(item);

      });

      const formattedTotal =
        "₦" + cartTotal.toLocaleString("en-NG");

      checkoutSubtotal.textContent =
        formattedTotal;

      checkoutTotal.textContent =
        formattedTotal;
    }
  // BODEGS DEMO ORDER FLOW
    const placeDemoOrderButton =
      document.getElementById("placeDemoOrder");


    // Shown after the Paystack pop-up closes: tells the buyer what happened and where to go next.
    function showPaySuccess(orderId, total, state) {
      var code = "BOD-" + String(orderId).replace(/-/g, "").slice(0, 8).toUpperCase();
      var naira = "\u20A6" + Number(total).toLocaleString("en-NG");
      var title = document.getElementById("psTitle");
      var text = document.getElementById("psText");
      if (state === "paid") {
        title.textContent = "Payment successful";
        text.textContent = "Thank you! Your order " + code + " has been placed. You can follow it in My Orders.";
      } else if (state === "cancelled") {
        title.textContent = "Payment received";
        text.textContent = "Order " + code + " had been cancelled, so we will refund this payment. Please contact BODEGS support if you do not see it soon.";
      } else {
        title.textContent = "Payment received";
        text.textContent = "We are confirming order " + code + ". It will show as Paid in My Orders in a few minutes.";
      }
      document.getElementById("psTotal").textContent = naira;
      document.getElementById("psBackdrop").hidden = false;
      document.getElementById("psView").onclick = function () { window.location.href = "orders.html"; };
      document.getElementById("psMore").onclick = function () { window.location.href = "index.html"; };
    }
    window.showPaySuccess = showPaySuccess;

    const checkoutMessage =
      document.getElementById("checkoutMessage");

    // Paystack TEST public key. It is safe to show; the secret key never goes in this page.
    const PAYSTACK_PUBLIC_KEY = "pk_test_7931850570204e5adeff382152b45f7f0077cf8e";
    let pendingOrder = null;

    // Pay now stays grey until the delivery address is set and the terms are accepted.
    function updatePayState() {
      const terms = document.getElementById("acceptTerms").checked;
      const ok = addressComplete() && terms;
      placeDemoOrderButton.disabled = !ok;
      const hint = document.getElementById("payHint");
      hint.textContent = ok ? "" : (!addressComplete() ? "Add a delivery address to continue." : "Accept the Terms & Conditions to continue.");
    }
    document.getElementById("acceptTerms").addEventListener("change", updatePayState);
    updatePayState();

    placeDemoOrderButton.addEventListener("click", async () => {
      const name =
        document.getElementById("checkoutName").value.trim();

      const phone =
        document.getElementById("checkoutPhone").value.trim();

      const address =
        document.getElementById("checkoutAddress").value.trim();

      const city =
        document.getElementById("checkoutCity").value.trim();

      if (!name || !phone || !address || !city) {
        checkoutMessage.textContent =
          "Please complete all delivery information.";
        return;
      }

      if (!Array.isArray(cartProducts) || cartProducts.length === 0) {
        checkoutMessage.textContent =
          "Your cart is empty. Add products before placing an order.";
        return;
      }

      // Only the product and the quantity are sent. The price is always
      // taken from the BODEGS database, never from this phone.
      const items = cartProducts.map(product => ({
        productId: String(product.productId || product.id || ""),
        quantity: Math.max(1, Math.min(99, Number(product.quantity) || 1))
      }));

      if (items.some(item => !item.productId)) {
        checkoutMessage.textContent =
          "Something is wrong with your cart. Please remove the item and add it again.";
        return;
      }

      placeDemoOrderButton.disabled = true;

      try {
        // The order is saved once. If the person closes the payment window and
        // tries again, the same order is paid instead of creating a new one.
        const signature = JSON.stringify(items) + name + phone + address + city;
        if (!pendingOrder || pendingOrder.signature !== signature) {
          checkoutMessage.textContent = "Placing your order...";

          const { data: orderId, error } = await sb.rpc("place_order", {
            p_items: items,
            p_name: name,
            p_phone: phone,
            p_address: address,
            p_city: city
          });

          if (error) {
            const reason = String(error.message || "");
            let text = "We couldn't place your order. Please try again.";

            if (reason.includes("not signed in")) {
              window.location.href = "login.html?next=checkout.html";
              return;
            }
            if (reason.includes("product not available")) {
              text = "One of the items in your cart is no longer available. Please remove it and try again.";
            } else if (reason.includes("not enough stock")) {
              text = "Sorry, one of the items in your cart is out of stock.";
            }

            checkoutMessage.textContent = text;
            updatePayState();
            return;
          }

          pendingOrder = { id: orderId, signature: signature };
          rememberDelivery(chosen);

          // Record the chosen size and colour on the saved order (best effort).
          try {
            await sb.rpc("tag_latest_order_items", {
              p_items: cartProducts.map(product => ({
                productId: String(product.productId || product.id || ""),
                size: String(product.size || ""),
                color: String(product.color || "")
              }))
            });
          } catch (e) { /* ignore */ }
        }

        // The amount always comes from the saved order, never from this phone.
        const found = await sb.from("orders").select("total").eq("id", pendingOrder.id).single();
        const session = await sb.auth.getSession();
        const email = session && session.data && session.data.session && session.data.session.user.email;
        if (found.error || !found.data || !email) throw new Error("order lookup failed");

        const reference = "BDG-" + String(pendingOrder.id).replace(/-/g, "").slice(0, 20) + "-" + Date.now();
        checkoutMessage.textContent = "Opening payment...";

        new PaystackPop().newTransaction({
          key: PAYSTACK_PUBLIC_KEY,
          email: email,
          amount: Math.round(Number(found.data.total) * 100),
          currency: "NGN",
          ref: reference,
          metadata: { order_id: pendingOrder.id },
          onSuccess: async function () {
            checkoutMessage.textContent = "Confirming your payment...";
            let paid = false, cancelledFlag = false;
            try {
              const res = await sb.functions.invoke("verify-payment", {
                body: { reference: reference, order_id: pendingOrder.id }
              });
              paid = !!(res.data && res.data.paid);
              cancelledFlag = !!(res.data && res.data.cancelled);
            } catch (e) { /* handled below */ }

            // The order is saved, so the cart is cleared either way.
            localStorage.removeItem("weraeCart");
            showPaySuccess(pendingOrder.id, found.data.total, paid ? "paid" : (cancelledFlag ? "cancelled" : "confirming"));
          },
          onCancel: function () {
            checkoutMessage.textContent = "Payment cancelled. Tap Pay now when you are ready.";
            updatePayState();
          }
        });
      } catch (e) {
        checkoutMessage.textContent = "We couldn't start the payment. Please try again.";
        updatePayState();
      }
    });
  
  </script>

</body>
