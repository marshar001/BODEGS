<!DOCTYPE html>
<html lang="en">
<head>
  <script src="cartkey.js?v=1"></script>
  <script src="dark.js?v=3"></script>
  <script src="press.js?v=1" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout — BODEGS</title>

  <meta
    name="description"
    content="Complete your BODEGS order."
  >

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css?v=20261031">
  <script src="theme.js?v=20261031" defer></script>
  <style>
    .saved-addrs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .saved-addrs[hidden] { display: none; }
    .saved-addrs button {
      border: 1px solid rgba(23, 59, 50, 0.3);
      border-radius: 18px;
      padding: 8px 14px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .saved-addrs button.active { background: #173b32; border-color: #173b32; color: #fff; }
    .save-addr-row { display: flex !important; flex-direction: row !important; align-items: center; gap: 10px; margin-top: 4px; font-size: 14px; }
    .save-addr-row input { width: 18px !important; height: 18px; flex: none; margin: 0; padding: 0; }
  </style>
</head>

<body>

  <main class="checkout-page">

    
<a href="cart.html" class="back-button" aria-label="Return to cart">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M15 5L8 12L15 19"></path>
  </svg>
</a>

    <header class="checkout-header">
      <p class="verified-badge">BODEGS CHECKOUT</p>
      <h1>Checkout</h1>
      <p>Enter your delivery information to continue.</p>
    </header>

    <section class="checkout-section">
      <h2>Delivery Information</h2>

      <div id="savedAddrs" class="saved-addrs" hidden></div>

      <label>
        Full Name
        <input
          type="text"
          id="checkoutName"
          placeholder="Enter your full name"
        >
      </label>

      <label>
        Phone Number
        <input
          type="tel"
          id="checkoutPhone"
          placeholder="Enter your phone number"
        >
      </label>

      <label>
        Delivery Address
        <textarea
          id="checkoutAddress"
          rows="3"
          placeholder="Enter your delivery address"
        ></textarea>
      </label>

      <label>
        City
        <input
          type="text"
          id="checkoutCity"
          placeholder="Enter your city"
        >
      </label>

      <label class="save-addr-row">
        <input type="checkbox" id="saveAddress" checked>
        <span>Save this address for next time</span>
      </label>
    </section>

    <section class="checkout-section">
      <div class="checkout-summary-header">
        <div>
          <h2>Order Summary</h2>
          <p id="checkoutItemCount"></p>
        </div>
      </div>

      <div id="checkoutItems"></div>

      <div class="checkout-summary-lines">

        <div class="checkout-summary-row">
          <span>Subtotal</span>
          <strong id="checkoutSubtotal">₦0</strong>
        </div>

        <div class="checkout-summary-row">
          <span>Delivery</span>
          <strong>Calculated at payment</strong>
        </div>

      </div>

      <div class="checkout-total">
        <span>Total</span>
        <strong id="checkoutTotal">₦0</strong>
      </div>
    </section>

        <button
      type="button"
      class="checkout-place-order"
      id="placeDemoOrder"
    >
      Pay now
    </button>

    <p id="checkoutMessage" role="status" aria-live="polite"></p>

  </main>

<script src="https://js.paystack.co/v2/inline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    // Must be signed in (real BODEGS login). Fill in the delivery details we already know,
    // so a returning customer does not type them again.
    let addrWho = "guest";

    function readList(key) {
      try { const v = JSON.parse(localStorage.getItem(key) || "[]"); return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    }

    function fillDelivery(d) {
      if (!d) return;
      const set = (id, value) => {
        const box = document.getElementById(id);
        if (box && value) box.value = value;
      };
      set("checkoutName", d.name);
      set("checkoutPhone", d.phone);
      set("checkoutAddress", d.address || d.line);
      set("checkoutCity", d.city);
    }

    function drawSavedAddresses(list) {
      const holder = document.getElementById("savedAddrs");
      if (!holder || !list.length) return;
      holder.hidden = false;
      holder.innerHTML = "";

      list.slice(0, 5).forEach(function (a, index) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = a.label || ("Address " + (index + 1));
        b.addEventListener("click", function () {
          holder.querySelectorAll("button").forEach(x => x.classList.remove("active"));
          b.classList.add("active");
          fillDelivery({ address: a.line, city: a.city });
        });
        holder.appendChild(b);
      });

      const fresh = document.createElement("button");
      fresh.type = "button";
      fresh.textContent = "+ New address";
      fresh.addEventListener("click", function () {
        holder.querySelectorAll("button").forEach(x => x.classList.remove("active"));
        fresh.classList.add("active");
        document.getElementById("checkoutAddress").value = "";
        document.getElementById("checkoutCity").value = "";
        document.getElementById("checkoutAddress").focus();
      });
      holder.appendChild(fresh);
    }

    requireLogin().then(function (user) {
      if (!user) return;
      const meta = user.user_metadata || {};
      addrWho = String(user.email || "guest").toLowerCase();

      const saved = readList("weraeAddresses:" + addrWho);
      let last = null;
      try { last = JSON.parse(localStorage.getItem("weraeDelivery:" + addrWho) || "null"); } catch (e) {}
      last = last || meta.bodegs_delivery || null;

      const nameBox = document.getElementById("checkoutName");
      if (nameBox && !nameBox.value && meta.full_name) nameBox.value = meta.full_name;

      if (last) fillDelivery(last);
      else if (saved.length) fillDelivery({ address: saved[0].line, city: saved[0].city });

      drawSavedAddresses(saved);
    });

    // Remember this delivery for next time (on this phone, and on the account for other devices).
    function rememberDelivery(d) {
      try { localStorage.setItem("weraeDelivery:" + addrWho, JSON.stringify(d)); } catch (e) {}
      try { sb.auth.updateUser({ data: { bodegs_delivery: d } }); } catch (e) {}

      const box = document.getElementById("saveAddress");
      if (box && !box.checked) return;
      try {
        const key = "weraeAddresses:" + addrWho;
        const list = readList(key);
        const exists = list.some(a => String(a.line || "").trim().toLowerCase() === d.address.toLowerCase()
          && String(a.city || "").trim().toLowerCase() === d.city.toLowerCase());
        if (!exists) {
          list.push({
            id: String(Date.now()),
            label: list.length ? "Address " + (list.length + 1) : "Home",
            line: d.address,
            city: d.city
          });
          localStorage.setItem(key, JSON.stringify(list));
        }
      } catch (e) {}
    }

    const checkoutItems =
      document.getElementById("checkoutItems");
    const checkoutItemCount =
      document.getElementById("checkoutItemCount");
    const checkoutSubtotal =
      document.getElementById("checkoutSubtotal");

    const checkoutTotal =
      document.getElementById("checkoutTotal");

    const cartProducts = JSON.parse(
      localStorage.getItem("weraeCart") || "[]"
    );

    if (cartProducts.length === 0) {

      checkoutItemCount.textContent = "0 items";

      checkoutItems.innerHTML = `
        <div class="checkout-empty">
          <p>Your cart is empty.</p>

          <a href="index.html" class="continue-shopping">
            Start Shopping
          </a>
        </div>
      `;

      checkoutSubtotal.textContent = "₦0";
      checkoutTotal.textContent = "₦0";

    } else {

      const totalQuantity = cartProducts.reduce(
        (total, product) => {
          return total + (product.quantity || 1);
        },
        0
      );

      checkoutItemCount.textContent =
        `${totalQuantity} ${totalQuantity === 1 ? "item" : "items"}`;

      let cartTotal = 0;

      cartProducts.forEach(product => {

        const numericPrice = Number(
  product.numericPrice ??
  String(product.price ?? 0).replace(/[^\d.]/g, "")
) || 0;

        const quantity = product.quantity || 1;

        const itemTotal =
          numericPrice * quantity;

        cartTotal += itemTotal;

        const item = document.createElement("article");

        item.className = "checkout-item";

        item.innerHTML = `
          <div class="checkout-item-image">
            <img
              src="${escapeHTML(product.image)}"
              alt="${escapeHTML(product.name)}"
            >
          </div>

          <div class="checkout-item-details">

            <h3>${escapeHTML(product.name)}</h3>

            <p class="checkout-item-seller">
              ${escapeHTML(product.sellerName || "BODEGS seller")}
            </p>

            ${(product.size || product.color) ? `<p class="checkout-item-quantity">${[product.color ? "Color: " + escapeHTML(product.color) : "", product.size ? "Size: " + escapeHTML(product.size) : ""].filter(Boolean).join(" · ")}</p>` : ""}

            <p class="checkout-item-quantity">
              Quantity: ${quantity}
            </p>

          </div>

          <div class="checkout-item-price">
            <strong>
              ₦${itemTotal.toLocaleString("en-NG")}
            </strong>
          </div>
        `;

        checkoutItems.appendChild(item);

      });

      const formattedTotal =
        "₦" + cartTotal.toLocaleString("en-NG");

      checkoutSubtotal.textContent =
        formattedTotal;

      checkoutTotal.textContent =
        formattedTotal;
    }
  // BODEGS DEMO ORDER FLOW
    const placeDemoOrderButton =
      document.getElementById("placeDemoOrder");

    const checkoutMessage =
      document.getElementById("checkoutMessage");

    // Paystack TEST public key. It is safe to show; the secret key never goes in this page.
    const PAYSTACK_PUBLIC_KEY = "pk_test_7931850570204e5adeff382152b45f7f0077cf8e";
    let pendingOrder = null;

    placeDemoOrderButton.addEventListener("click", async () => {
      const name =
        document.getElementById("checkoutName").value.trim();

      const phone =
        document.getElementById("checkoutPhone").value.trim();

      const address =
        document.getElementById("checkoutAddress").value.trim();

      const city =
        document.getElementById("checkoutCity").value.trim();

      if (!name || !phone || !address || !city) {
        checkoutMessage.textContent =
          "Please complete all delivery information.";
        return;
      }

      if (!Array.isArray(cartProducts) || cartProducts.length === 0) {
        checkoutMessage.textContent =
          "Your cart is empty. Add products before placing an order.";
        return;
      }

      // Only the product and the quantity are sent. The price is always
      // taken from the BODEGS database, never from this phone.
      const items = cartProducts.map(product => ({
        productId: String(product.productId || product.id || ""),
        quantity: Math.max(1, Math.min(99, Number(product.quantity) || 1))
      }));

      if (items.some(item => !item.productId)) {
        checkoutMessage.textContent =
          "Something is wrong with your cart. Please remove the item and add it again.";
        return;
      }

      placeDemoOrderButton.disabled = true;

      try {
        // The order is saved once. If the person closes the payment window and
        // tries again, the same order is paid instead of creating a new one.
        const signature = JSON.stringify(items) + name + phone + address + city;
        if (!pendingOrder || pendingOrder.signature !== signature) {
          checkoutMessage.textContent = "Placing your order...";

          const { data: orderId, error } = await sb.rpc("place_order", {
            p_items: items,
            p_name: name,
            p_phone: phone,
            p_address: address,
            p_city: city
          });

          if (error) {
            const reason = String(error.message || "");
            let text = "We couldn't place your order. Please try again.";

            if (reason.includes("not signed in")) {
              window.location.href = "login.html?next=checkout.html";
              return;
            }
            if (reason.includes("product not available")) {
              text = "One of the items in your cart is no longer available. Please remove it and try again.";
            } else if (reason.includes("not enough stock")) {
              text = "Sorry, one of the items in your cart is out of stock.";
            }

            checkoutMessage.textContent = text;
            placeDemoOrderButton.disabled = false;
            return;
          }

          pendingOrder = { id: orderId, signature: signature };
          rememberDelivery({ name: name, phone: phone, address: address, city: city });

          // Record the chosen size and colour on the saved order (best effort).
          try {
            await sb.rpc("tag_latest_order_items", {
              p_items: cartProducts.map(product => ({
                productId: String(product.productId || product.id || ""),
                size: String(product.size || ""),
                color: String(product.color || "")
              }))
            });
          } catch (e) { /* ignore */ }
        }

        // The amount always comes from the saved order, never from this phone.
        const found = await sb.from("orders").select("total").eq("id", pendingOrder.id).single();
        const session = await sb.auth.getSession();
        const email = session && session.data && session.data.session && session.data.session.user.email;
        if (found.error || !found.data || !email) throw new Error("order lookup failed");

        const reference = "BDG-" + String(pendingOrder.id).replace(/-/g, "").slice(0, 20) + "-" + Date.now();
        checkoutMessage.textContent = "Opening payment...";

        new PaystackPop().newTransaction({
          key: PAYSTACK_PUBLIC_KEY,
          email: email,
          amount: Math.round(Number(found.data.total) * 100),
          currency: "NGN",
          ref: reference,
          metadata: { order_id: pendingOrder.id },
          onSuccess: async function () {
            checkoutMessage.textContent = "Confirming your payment...";
            let paid = false;
            try {
              const res = await sb.functions.invoke("verify-payment", {
                body: { reference: reference, order_id: pendingOrder.id }
              });
              paid = !!(res.data && res.data.paid);
            } catch (e) { /* handled below */ }

            // The order is saved, so the cart is cleared either way.
            localStorage.removeItem("weraeCart");
            if (!paid) {
              alert("We received your payment and are confirming it. Please check My Orders in a few minutes.");
            }
            window.location.href = "orders.html";
          },
          onCancel: function () {
            checkoutMessage.textContent = "Payment cancelled. Tap Pay now when you are ready.";
            placeDemoOrderButton.disabled = false;
          }
        });
      } catch (e) {
        checkoutMessage.textContent = "We couldn't start the payment. Please try again.";
        placeDemoOrderButton.disabled = false;
      }
    });
  
  </script>

</body>
</html>
